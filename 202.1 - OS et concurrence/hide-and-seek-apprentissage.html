<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hide & Seek — Apprendre en jouant</title>
<style>
  :root {
    --bg: #f5f7fb;
    --surface: #ffffff;
    --surface-2: #fafbfd;
    --text: #0d0d0d;
    --muted: #6b7280;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --accent: #4d6bfe;
    --accent-hover: #3a56e0;
    --accent-soft: #eef2ff;
    --success: #16a34a;
    --success-soft: #dcfce7;
    --warning: #f59e0b;
    --warning-soft: #fef3c7;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --purple: #8b5cf6;
    --purple-soft: #f3e8ff;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow: 0 4px 14px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 30px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
  }
  code, .mono {
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.92em;
  }
  .app {
    max-width: 920px;
    margin: 0 auto;
    padding: 20px 16px 80px;
  }

  /* ===== Topbar ===== */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(245,247,251,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    margin: -20px -16px 16px;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner {
    max-width: 920px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 180px;
  }
  .brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    color: white;
    box-shadow: var(--shadow-sm);
  }
  .brand-text h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .brand-text p {
    margin: 0;
    font-size: 11.5px;
    color: var(--muted);
  }

  .xp-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px 5px 5px;
    box-shadow: var(--shadow-sm);
  }
  .level-ring {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
  }
  .xp-info {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }
  .xp-info .num {
    font-size: 13px;
    font-weight: 700;
  }
  .xp-info .lbl {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
  }

  .streak-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--warning-soft);
    color: #92400e;
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 12px;
    font-weight: 600;
  }

  .timer-box {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 4px 4px 12px;
    box-shadow: var(--shadow-sm);
  }
  .timer-display {
    font-family: ui-monospace, monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    min-width: 46px;
    text-align: center;
  }
  .timer-display.done { color: var(--success); }
  .timer-btn {
    border: none;
    background: var(--accent);
    color: white;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    transition: transform 0.15s;
  }
  .timer-btn:active { transform: scale(0.92); }

  /* ===== Tabs ===== */
  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 18px;
    scrollbar-width: thin;
  }
  .tabs::-webkit-scrollbar { height: 4px; }
  .tabs::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
  .tab {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .tab:hover { border-color: var(--border-strong); }
  .tab.active {
    background: var(--text);
    color: white;
    border-color: var(--text);
  }
  .tab .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 10.5px;
    font-weight: 700;
  }
  .tab.active .num {
    background: rgba(255,255,255,0.2);
    color: white;
  }
  .tab.done .num {
    background: var(--success);
    color: white;
  }

  /* ===== Cards ===== */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s;
  }
  .card:hover { box-shadow: var(--shadow); }
  .card h2 {
    margin: 0 0 6px;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .card h3 {
    margin: 18px 0 8px;
    font-size: 15px;
    font-weight: 600;
  }
  .card h3:first-child { margin-top: 0; }
  .card p { margin: 8px 0; }
  .card .muted { color: var(--muted); font-size: 13px; }

  .hero {
    background: linear-gradient(135deg, var(--surface) 0%, var(--accent-soft) 200%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px 24px;
    margin-bottom: 18px;
  }
  .hero h2 {
    margin: 0 0 8px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .hero p {
    margin: 6px 0;
    color: var(--muted);
    font-size: 14.5px;
    max-width: 600px;
  }

  /* Module cards in dashboard */
  .module-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 640px) {
    .module-grid { grid-template-columns: 1fr 1fr; }
  }
  .module-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .module-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  .module-card.done {
    background: var(--success-soft);
    border-color: #86efac;
  }
  .module-card-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
  }
  .module-emoji {
    font-size: 24px;
    line-height: 1;
    flex-shrink: 0;
  }
  .module-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .module-title {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .module-desc {
    font-size: 12.5px;
    color: var(--muted);
    margin: 0 0 10px;
    line-height: 1.45;
  }
  .mini-bar {
    height: 5px;
    background: #ececec;
    border-radius: 999px;
    overflow: hidden;
  }
  .mini-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  .module-card.done .mini-bar-fill { background: var(--success); }
  .module-progress {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
  }
  .module-progress .pct { font-weight: 600; color: var(--text); }

  /* Lesson content */
  .lesson {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin: 12px 0;
  }
  .lesson p { margin: 6px 0; font-size: 14px; }
  .lesson ul { margin: 6px 0; padding-left: 20px; }
  .lesson li { margin: 4px 0; font-size: 14px; }

  .concept {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .concept:last-child { border-bottom: none; }
  .concept-key {
    font-family: ui-monospace, monospace;
    font-size: 12.5px;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 3px 8px;
    border-radius: 6px;
    height: fit-content;
    font-weight: 600;
    white-space: nowrap;
  }
  .concept-body { font-size: 13.5px; line-height: 1.5; }
  .concept-body strong { font-weight: 600; }

  pre {
    background: #0f172a;
    color: #e2e8f0;
    padding: 14px 16px;
    border-radius: var(--radius-sm);
    overflow-x: auto;
    font-family: ui-monospace, monospace;
    font-size: 12.5px;
    line-height: 1.55;
    margin: 10px 0;
  }
  pre .k { color: #c792ea; }
  pre .s { color: #c3e88d; }
  pre .n { color: #f78c6c; }
  pre .c { color: #64748b; font-style: italic; }
  pre .f { color: #82aaff; }
  code {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 1px 6px;
    border-radius: 5px;
    font-size: 0.9em;
  }

  /* Tasks */
  .tasks-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 20px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .task {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 11px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 4px;
    user-select: none;
  }
  .task:hover { background: var(--surface-2); }
  .task .cb {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border: 2px solid var(--border-strong);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    transition: all 0.18s;
    margin-top: 1px;
  }
  .task .cb svg { opacity: 0; transform: scale(0.5); transition: all 0.18s; }
  .task.done .cb {
    background: var(--accent);
    border-color: var(--accent);
  }
  .task.done .cb svg { opacity: 1; transform: scale(1); }
  .task-body { flex: 1; }
  .task-label {
    font-size: 13.5px;
    font-weight: 500;
    transition: color 0.15s;
  }
  .task.done .task-label {
    text-decoration: line-through;
    color: var(--muted);
  }
  .task-xp {
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
    background: var(--accent-soft);
    padding: 1px 7px;
    border-radius: 999px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .task.done .task-xp {
    background: var(--success-soft);
    color: var(--success);
  }

  /* Quizzes */
  .quiz {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
    margin: 14px 0;
  }
  .quiz-q {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .quiz-q .icon {
    flex-shrink: 0;
    font-size: 15px;
  }
  .quiz-opts {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .quiz-opt {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    font-family: inherit;
    color: inherit;
    width: 100%;
  }
  .quiz-opt:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .quiz-opt:disabled { cursor: default; }
  .quiz-opt .letter {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
  }
  .quiz-opt.correct {
    background: var(--success-soft);
    border-color: var(--success);
  }
  .quiz-opt.correct .letter { background: var(--success); color: white; }
  .quiz-opt.wrong {
    background: var(--danger-soft);
    border-color: var(--danger);
  }
  .quiz-opt.wrong .letter { background: var(--danger); color: white; }
  .quiz-explain {
    margin-top: 12px;
    padding: 11px 13px;
    background: white;
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    font-size: 13px;
    color: var(--text);
    line-height: 1.5;
    display: none;
  }
  .quiz-explain.show { display: block; animation: slideIn 0.25s ease; }
  .quiz-explain strong { color: var(--accent); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Predict */
  .predict {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
    margin: 14px 0;
  }
  .predict pre { margin: 8px 0 12px; }
  .predict label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .predict-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .predict input {
    flex: 1;
    min-width: 140px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: ui-monospace, monospace;
    font-size: 13px;
    background: white;
    outline: none;
    transition: border-color 0.15s;
  }
  .predict input:focus { border-color: var(--accent); }
  .predict input.correct { border-color: var(--success); background: var(--success-soft); }
  .predict input.wrong { border-color: var(--danger); background: var(--danger-soft); }
  .predict-result {
    margin-top: 10px;
    font-size: 13px;
    display: none;
    line-height: 1.5;
  }
  .predict-result.show { display: block; animation: slideIn 0.25s ease; }
  .predict-result strong { color: var(--accent); }

  /* Buttons */
  .btn {
    border: none;
    background: var(--accent);
    color: white;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(0.97); }
  .btn-ghost {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--surface-2); border-color: var(--border-strong); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }

  /* Interactive widgets */
  .widget {
    background: linear-gradient(135deg, #fbfcff 0%, var(--surface) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin: 14px 0;
    box-shadow: var(--shadow-sm);
  }
  .widget-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin-bottom: 14px;
  }
  .widget-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
    flex-wrap: wrap;
  }
  .widget label {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    min-width: 60px;
  }
  input[type="range"] {
    flex: 1;
    min-width: 120px;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(77,107,254,0.35);
    transition: transform 0.15s;
  }
  input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.15); }
  input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
    border: none;
  }
  .val-badge {
    font-family: ui-monospace, monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 10px;
    border-radius: 7px;
    min-width: 40px;
    text-align: center;
  }
  .visual-bar {
    display: flex;
    height: 40px;
    border-radius: 8px;
    overflow: hidden;
    margin: 14px 0;
    border: 1px solid var(--border);
    background: white;
  }
  .visual-bar > div {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    font-weight: 700;
    color: white;
    transition: width 0.3s ease;
  }
  .bar-size { background: var(--accent); }
  .bar-pad { background: #fbbf24; }
  .result-line {
    margin-top: 12px;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }
  .result-line .formula {
    font-family: ui-monospace, monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .result-line .result {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
  }

  /* Byte viewer */
  .byte-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: ui-monospace, monospace;
    font-size: 14px;
    background: white;
    outline: none;
    margin-bottom: 12px;
  }
  .byte-input:focus { border-color: var(--accent); }
  .byte-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 14px 0;
    flex-wrap: wrap;
  }
  .byte {
    width: 60px;
    height: 72px;
    background: white;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: ui-monospace, monospace;
    transition: all 0.25s;
    position: relative;
  }
  .byte .val {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  .byte .addr {
    font-size: 9px;
    color: var(--muted);
    margin-top: 4px;
  }
  .byte.highlight { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .byte.sorted { animation: pop 0.4s ease; }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); background: var(--success-soft); border-color: var(--success); }
    100% { transform: scale(1); }
  }

  /* Pointer tagging */
  .ptr-visual {
    display: flex;
    gap: 2px;
    justify-content: center;
    margin: 16px 0;
    flex-wrap: wrap;
  }
  .bit {
    width: 26px;
    height: 34px;
    background: white;
    border: 1px solid var(--border);

function moduleProgress(mod) {
  let done = 0;
  mod.tasks.forEach(t => { if (state.tasks[t.id]) done++; });
  return { done, total: mod.tasks.length, pct: mod.tasks.length ? done / mod.tasks.length : 0 };
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  let html = `<button class="tab ${state.currentView === 'dashboard' ? 'active' : ''}" data-view="dashboard">
    <span class="num">★</span> Vue d'ensemble
  </button>`;
  MODULES.forEach(m => {
    const p = moduleProgress(m);
    const isDone = p.done === p.total;
    const active = state.currentView === m.id;
    html += `<button class="tab ${active ? 'active' : ''} ${isDone && !active ? 'done' : ''}" data-view="${m.id}">
      <span class="num">${isDone ? '✓' : m.num}</span> ${m.emoji} ${m.title}
    </button>`;
  });
  tabs.innerHTML = html;
}

      <div class="module-card ${isDone ? 'done' : ''}" data-view="${m.id}">
        <div class="module-card-head">
          <div class="module-emoji">${m.emoji}</div>

            </div>
          </div>
        </div>
        <p class="module-desc">${m.desc}</p>
        <div class="mini-bar"><div class="mini-bar-fill" style="width:${Math.round(p.pct*100)}%"></div></div>
        <div class="module-progress">

        </div>
      </div>
    `;
  });

  html += `</div>`;
  return html;
}

/* =============================================================
   RENDER — MODULE PAGE
   ============================================================= */
function findNextUncompletedModule() {
  for (const m of MODULES) {
    const p = moduleProgress(m);
    if (p.done < p.total) return m.id;
  }
  return null;
}

function renderModule(mod) {
  const p = moduleProgress(mod);
  const nextMod = MODULES[MODULES.indexOf(mod) + 1];
  const prevMod = MODULES[MODULES.indexOf(mod) - 1];

  let html = `
    <div class="card">
      <div class="section-header">
        <div class="emoji">${mod.emoji}</div>
        <div class="info">
          <h2>${mod.num}. ${mod.title}</h2>
          <div class="meta">
            <span class="pill">⏱ ${mod.duration} min</span>
            <span class="pill">🎯 ${mod.tasks.length} tâches</span>
            <span class="pill">${p.done}/${p.total} fait</span>
          </div>
        </div>
      </div>
      <p class="muted" style="margin-top:12px;">${mod.desc}</p>
    </div>
  `;

  html += renderModuleContent(mod.id);

  // Tasks checklist
  html += `
    <div class="card">
      <div class="tasks-title">📋 Tâches du bloc</div>
  `;
  mod.tasks.forEach(t => {
    const isDone = !!state.tasks[t.id];
    html += `
      <div class="task ${isDone ? 'done' : ''}" data-task="${t.id}" data-xp="${t.xp}">
        <div class="cb">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2.5 6.2L4.8 8.5L9.5 3.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="task-body">
          <div class="task-label">${t.label}<span class="task-xp">+${t.xp} XP</span></div>
        </div>
      </div>
    `;
  });
  html += `</div>`;

  // Nav
  html += `<div class="bottom-nav">`;
  html += prevMod
    ? `<button class="btn btn-ghost" data-view="${prevMod.id}">← ${prevMod.emoji} ${prevMod.title}</button>`
    : `<button class="btn btn-ghost" data-view="dashboard">← Vue d'ensemble</button>`;
  if (nextMod) {
    html += `<button class="btn" data-view="${nextMod.id}">Suivant : ${nextMod.emoji} ${nextMod.title} →</button>`;
  } else {
    html += `<button class="btn" data-view="dashboard">Terminer ✓</button>`;
  }
  html += `</div>`;

  return html;
}

/* =============================================================
   MODULE CONTENT (HTML par module)
   ============================================================= */
function renderModuleContent(id) {
  switch (id) {
    case 'm0': return contentM0();
    case 'm1': return contentM1();
    case 'm2': return contentM2();
    case 'm3': return contentM3();
    case 'm4': return contentM4();
    case 'm5': return contentM5();
    default: return '';
  }
}

function quiz(id) {
  const q = QUIZZES[id];
  if (!q) return '';
  const chosen = state.quizzes[id];
  return `
    <div class="quiz" data-quiz="${id}">
      <div class="quiz-q"><span class="icon">❓</span><span>${q.q}</span></div>
      ${q.code ? `<pre>${escapeHtml(q.code)}</pre>` : ''}
      <div class="quiz-opts">
        ${q.opts.map((opt, i) => {
          let cls = '';
          if (chosen !== undefined) {
            if (i === q.correct) cls = 'correct';
            else if (i === chosen) cls = 'wrong';
          }
          return `<button class="quiz-opt ${cls}" data-opt="${i}" ${chosen !== undefined ? 'disabled' : ''}>
            <span class="letter">${String.fromCharCode(65+i)}</span>
            <span>${opt}</span>
          </button>`;
        }).join('')}
      </div>
      <div class="quiz-explain ${chosen !== undefined ? 'show' : ''}">
        💡 ${q.explain}
      </div>
    </div>
  `;
}

function predict(id) {
  const p = PREDICTS[id];
  if (!p) return '';
  const submitted = state.predicts[id];
  return `
    <div class="predict" data-predict="${id}">
      <div class="quiz-q"><span class="icon">🔮</span><span>${p.prompt}</span></div>
      <pre>${escapeHtml(p.code)}</pre>
      <label>Ta réponse :</label>
      <div class="predict-row">
        <input type="text" placeholder="Tape ta réponse..." value="${submitted ? escapeAttr(submitted.value) : ''}" ${submitted ? 'disabled' : ''}>
        <button class="btn" data-predict-submit="${id}">${submitted ? '✓ Validé' : 'Vérifier'}</button>
      </div>
      <div class="predict-result ${submitted ? 'show' : ''}">
        ${submitted ? `<div style="margin-bottom:6px;">${submitted.correct ? '✅ <strong>Correct !</strong>' : '❌ <strong>Pas tout à fait.</strong> Réponse attendue : <code>'+p.answer+'</code>'}</div>💡 ${p.explain}` : ''}
      </div>
    </div>
  `;
}

/* =============================================================

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(s) { return escapeHtml(s); }

/* =============================================================
   RENDER ROOT
   ============================================================= */
function render() {
  renderTabs();
  updateXpUI();
  const main = document.getElementById('main');

  if (state.currentView === 'dashboard') {
    main.innerHTML = renderDashboard();
  } else {
    const mod = MODULES.find(m => m.id === state.currentView);
    if (!mod) { state.currentView = 'dashboard'; return render(); }
    main.innerHTML = renderModule(mod);
  }
  initWidgets();

  // scroll to top on view change
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =============================================================
   XP & LEVELS
   ============================================================= */
function levelFromXp(xp) {
  let level = 1;
  let threshold = 50;
  let remaining = xp;
  while (remaining >= threshold) {
    remaining -= threshold;
    level++;
    threshold = 50 + (level - 1) * 25;
  }
  return { level, remaining, next: threshold };
}

function updateXpUI() {
  const { level, remaining, next } = levelFromXp(state.xp);
  document.getElementById('levelRing').textContent = level;
  document.getElementById('xpNum').textContent = state.xp;
  document.getElementById('xpNext').textContent = `${next - remaining} pour niv. ${level + 1}`;
  document.getElementById('streakNum').textContent = state.streak;
}

function showToast(msg, xp) {
  const el = document.getElementById('toast');
  el.innerHTML = xp ? `${msg} <span class="xp">+${xp} XP</span>` : msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

function addXp(amount) {
  state.xp += amount;
  updateXpUI();
}

function confetti() {
  for (let i = 0; i < 24; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = '-20px';
    c.style.background = ['#4d6bfe', '#8b5cf6', '#f59e0b', '#16a34a'][i % 4];
    c.style.animation = `fall ${1 + Math.random() * 1.5}s linear forwards`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2500);
  }
}

/* =============================================================
   EVENT HANDLERS
   ============================================================= */
document.addEventListener('click', (e) => {
  // Navigation
  const navEl = e.target.closest('[data-view]');
  if (navEl) {
    state.currentView = navEl.dataset.view;
    saveState();
    render();
    return;
  }

  // Task toggle
  const taskEl = e.target.closest('.task[data-task]');
  if (taskEl) {
    const id = taskEl.dataset.task;
    const xp = parseInt(taskEl.dataset.xp, 10) || 0;
    if (state.tasks[id]) {
      // Uncheck — remove xp? Non, on garde les XP (récompense déjà méritée)
      delete state.tasks[id];
      taskEl.classList.remove('done');
    } else {
      state.tasks[id] = true;
      taskEl.classList.add('done');
      addXp(xp);
      showToast('Tâche terminée !', xp);
    }
    saveState();
    // Update tabs to reflect module completion
    renderTabs();
    return;
  }

  // Quiz option
  const optBtn = e.target.closest('.quiz-opt');
  if (optBtn && !optBtn.disabled) {
    const quizEl = optBtn.closest('[data-quiz]');
    const id = quizEl.dataset.quiz;
    if (state.quizzes[id] !== undefined) return;
    const chosen = parseInt(optBtn.dataset.opt, 10);
    const q = QUIZZES[id];
    const isCorrect = chosen === q.correct;

    state.quizzes[id] = chosen;
    if (isCorrect) {
      state.streak++;
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;
      addXp(10);
      showToast('Bonne réponse !', 10);
    } else {
      state.streak = 0;
      showToast('Raté — lis l\'explication 👇');
    }
    saveState();
    updateXpUI();

    // Update UI in place
    const opts = quizEl.querySelectorAll('.quiz-opt');
    opts.forEach((b, i) => {
      b.disabled = true;
      if (i === q.correct) b.classList.add('correct');
      else if (i === chosen) b.classList.add('wrong');
    });
    quizEl.querySelector('.quiz-explain').classList.add('show');
    return;
  }

  // Predict submit
  const predBtn = e.target.closest('[data-predict-submit]');
  if (predBtn) {
    const id = predBtn.dataset.predictSubmit;
    const wrap = predBtn.closest('[data-predict]');
    const input = wrap.querySelector('input');
    const val = input.value.trim();
    if (!val) return;
    const p = PREDICTS[id];
    const normalize = s => s.replace(/\s+/g, ' ').toLowerCase().trim();
    const isCorrect = normalize(val) === normalize(p.answer);

    state.predicts[id] = { value: val, correct: isCorrect };
    if (isCorrect) {
      state.streak++;
      addXp(15);
      showToast('Exact !', 15);
    } else {
      state.streak = 0;
      showToast('Pas tout à fait.');
    }
    saveState();
    updateXpUI();

    input.disabled = true;
    input.classList.add(isCorrect ? 'correct' : 'wrong');
    predBtn.disabled = true;
    predBtn.textContent = isCorrect ? '✓ Validé' : '✗ Raté';
    const res = wrap.querySelector('.predict-result');
    res.innerHTML = isCorrect
      ? `✅ <strong>Correct !</strong><br>💡 ${p.explain}`
      : `❌ <strong>Réponse attendue :</strong> <code>${escapeHtml(p.answer)}</code><br>💡 ${p.explain}`;
    res.classList.add('show');
    return;
  }
});

document.getElementById('resetAll').addEventListener('click', () => {
  if (confirm('Effacer toute la progression (XP, tâches, réponses) ?')) {
    state = { ...defaultState };
    saveState();
    render();
    showToast('Progression réinitialisée');
  }
});

/* =============================================================
   TIMER POMODORO
   ============================================================= */
let timerDuration = 15 * 60;
let timerRemaining = timerDuration;
let timerRunning = false;
let timerInterval = null;
const timerEl = document.getElementById('timerDisplay');
const timerBtn = document.getElementById('timerBtn');

function fmtTime(s) {
  const m = Math.floor(s / 60).toString().padStart(2, '0');
  const sec = (s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}
function updateTimerDisplay() {
  timerEl.textContent = fmtTime(timerRemaining);
  timerEl.classList.toggle('done', timerRemaining === 0);
}
timerBtn.addEventListener('click', () => {
  timerRunning = !timerRunning;
  timerBtn.textContent = timerRunning ? '❚❚' : '▶';
  if (timerRunning) {
    timerInterval = setInterval(() => {
      timerRemaining--;
      if (timerRemaining <= 0) {
        timerRemaining = 0;
        clearInterval(timerInterval);
        timerRunning = false;
        timerBtn.textContent = '▶';
        showToast('⏰ Pause ! Lève-toi, bois de l\'eau.');
      }
      updateTimerDisplay();
    }, 1000);
  } else {
    clearInterval(timerInterval);
  }
});
document.getElementById('timerReset').addEventListener('click', () => {
  clearInterval(timerInterval);
  timerRunning = false;
  timerBtn.textContent = '▶';
  timerRemaining = timerDuration;
  updateTimerDisplay();
});
updateTimerDisplay();

/* =============================================================
   WIDGETS INTERACTIFS
   ============================================================= */
function initWidgets() {
  initStrideWidget();
  initByteWidget();
  initSortWidget();
  initTagWidget();
}

/* --- Stride --- */
function initStrideWidget() {
  const sizeSlider = document.getElementById('strideSize');
  const alignSlider = document.getElementById('strideAlign');
  if (!sizeSlider) return;
  // mapping align slider [1..8] → [1,2,4,8,16,32,64,128]
  const alignValues = [1, 2, 4, 8, 16, 32, 64, 128];

  function update() {
    const size = parseInt(sizeSlider.value, 10);
    const alignIdx = parseInt(alignSlider.value, 10) - 1;
    const alignment = alignValues[alignIdx];
    const stride = Math.ceil(size / alignment) * alignment;
    const pad = stride - size;

    document.getElementById('strideSizeVal').textContent = size;
    document.getElementById('strideAlignVal').textContent = alignment;
    document.getElementById('strideFormula').textContent = `(${size} + ${alignment - 1}) / ${alignment} * ${alignment}`;
    document.getElementById('strideResult').textContent = stride;

    const total = stride;
    const sizePct = (size / total) * 100;
    const padPct = (pad / total) * 100;
    document.getElementById('barSize').style.width = sizePct + '%';
    document.getElementById('barPad').style.width = padPct + '%';
    document.getElementById('barSize').textContent = size + 'o';
    document.getElementById('barPad').textContent = pad > 0 ? pad + 'o pad' : '';
  }
  sizeSlider.addEventListener('input', update);
  alignSlider.addEventListener('input', update);
  update();
}

/* --- Byte Viewer --- */
function initByteWidget() {
  const input = document.getElementById('byteInput');
  const row = document.getElementById('byteRow');
  const resultEl = document.getElementById('byteResult');
  if (!input) return;

  function parseValue(str) {
    str = str.trim();
    if (!str) return 0;
    if (str.startsWith('0x') || str.startsWith('0X')) {
      const v = parseInt(str, 16);
      return isNaN(v) ? 0 : (v >>> 0);
    }
    const v = parseInt(str, 10);
    return isNaN(v) ? 0 : (v >>> 0);
  }
  function update() {
    const v = parseValue(input.value);
    // little-endian bytes
    const b0 = v & 0xff;
    const b1 = (v >> 8) & 0xff;
    const b2 = (v >> 16) & 0xff;
    const b3 = (v >> 24) & 0xff;
    const bytes = [b0, b1, b2, b3]; // memory order (low addr first)
    row.innerHTML = bytes.map((b, i) => `
      <div class="byte" title="octet ${i} en mémoire (adresse ${i})">
        <div class="val">${b.toString(16).padStart(2, '0')}</div>
        <div class="addr">@+${i}</div>
      </div>
    `).join('');
    resultEl.textContent = '0x' + v.toString(16).padStart(8, '0').toUpperCase();
  }
  input.addEventListener('input', update);
  update();
}

/* --- Sort Widget --- */
function initSortWidget() {
  const input = document.getElementById('sortInput');
  const row = document.getElementById('sortRow');
  const resultEl = document.getElementById('sortResult');
  const autoBtn = document.getElementById('sortAuto');
  const resetBtn = document.getElementById('sortReset');
  if (!input) return;

  let original = 0;
  let current = 0;

  function parseValue(str) {
    str = str.trim();
    if (str.startsWith('0x') || str.startsWith('0X')) {
      const v = parseInt(str, 16);
      return isNaN(v) ? 0 : (v >>> 0);
    }
    const v = parseInt(str, 10);
    return isNaN(v) ? 0 : (v >>> 0);
  }
  function bytesFromValue(v) {
    return [v & 0xff, (v >> 8) & 0xff, (v >> 16) & 0xff, (v >> 24) & 0xff];
  }
  function valueFromBytes(bytes) {
    return (bytes[0] | (bytes[1] << 8) | (bytes[2] << 16) | (bytes[3] << 24)) >>> 0;
  }
  function renderBytes(bytes, highlightSorted) {
    row.innerHTML = bytes.map((b, i) => `
      <div class="byte ${highlightSorted ? 'sorted' : ''}" data-idx="${i}" style="cursor: pointer;" title="Clique pour échanger avec le suivant">
        <div class="val">${b.toString(16).padStart(2, '0')}</div>
        <div class="addr">@+${i}</div>
      </div>
    `).join('');
    resultEl.textContent = '0x' + valueFromBytes(bytes).toString(16).padStart(8, '0').toUpperCase();
  }
  function update() {
    original = parseValue(input.value);
    current = original;
    renderBytes(bytesFromValue(current), false);
  }

  // Click on a byte = swap with next
  row.addEventListener('click', (e) => {
    const el = e.target.closest('.byte');
    if (!el) return;
    const i = parseInt(el.dataset.idx, 10);
    if (i >= 3) return;
    const bytes = bytesFromValue(current);
    [bytes[i], bytes[i+1]] = [bytes[i+1], bytes[i]];
    current = valueFromBytes(bytes);
    renderBytes(bytes, false);
  });

  autoBtn.addEventListener('click', () => {
    const bytes = bytesFromValue(current);
    bytes.sort((a, b) => a - b);
    current = valueFromBytes(bytes);
    renderBytes(bytes, true);
  });

  resetBtn.addEventListener('click', () => {
    current = original;
    renderBytes(bytesFromValue(current), false);
  });

  input.addEventListener('input', update);
  update();
}

/* --- Tag Widget --- */
function initTagWidget() {
  const visual = document.getElementById('ptrVisual');
  const taggedAddrEl = document.getElementById('taggedAddr');
  const subEl = document.getElementById('tagSub');
  if (!visual) return;

  // A fixed fake address ending in ...0b00 (aligned)
  const BASE_ADDR = 0x7ffed4c0; // ends with 0b00
  let tag = 0; // 0, 1, 2, 3

  function render() {
    const addr = BASE_ADDR | tag;
    // show last 8 bits + some high bits for context
    const fullBin = addr.toString(2).padStart(32, '0');
    // We'll show : 6 fixed bits at start, ... then 2 tag bits at end
    const shownBits = fullBin.slice(-12); // 12 derniers bits
    const fixedBits = shownBits.slice(0, 10); // 10 premiers affichés = fixes
    const tagBits = shownBits.slice(-2); // 2 derniers = tag

    let html = '';
    // Show a truncated prefix
    html += `<div class="bit fixed" title="bits hauts (fixes)">…</div>`;
    fixedBits.split('').forEach(b => {
      html += `<div class="bit fixed">${b}</div>`;
    });
    tagBits.split('').forEach((b, i) => {
      html += `<div class="bit tag ${b === '1' ? 'on' : ''}" data-tagbit="${i}" title="Bit ${i} du tag — clique pour basculer">${b}</div>`;
    });
    visual.innerHTML = html;

    taggedAddrEl.textContent = '0x' + addr.toString(16).toUpperCase();
    subEl.textContent = `addr = 0x${BASE_ADDR.toString(16).toUpperCase()}  ·  tag = 0b${tag.toString(2).padStart(2, '0')}`;
  }

  visual.addEventListener('click', (e) => {
    const bitEl = e.target.closest('[data-tagbit]');
    if (!bitEl) return;
    const i = parseInt(bitEl.dataset.tagbit, 10);
    // i = 0 → bit de poids faible (0b01), i = 1 → 0b10
    tag ^= (1 << i);
    render();
  });

  render();
}

/* =============================================================
   INIT
   ============================================================= */
render();
