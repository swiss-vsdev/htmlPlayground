<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Playground Physique — 12 sprints</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font:13px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
    background:#f7f8fa;color:#0d0d0d;
    -webkit-font-smoothing:antialiased;
    display:flex;
    min-height:100vh;
    min-height:100dvh;
  }
  .sidebar{
    position:sticky;top:0;
    width:240px;flex:0 0 240px;
    height:100vh;height:100dvh;
    background:#fff;
    border-right:1px solid #e5e5e5;
    display:flex;flex-direction:column;
    z-index:10;
  }
  .sidebar-head{flex:0 0 auto;padding:14px 16px 11px;border-bottom:1px solid #f0f1f4}
  .brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:13px;color:#0d0d0d}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:#4d6bfe;flex:0 0 auto}
  .brand-sub{color:#8b9096;font-weight:500;font-size:11px;margin-top:3px;padding-left:16px}
  .sidebar-list{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px}
  .sidebar-list::-webkit-scrollbar{width:6px}
  .sidebar-list::-webkit-scrollbar-thumb{background:#e0e3e8;border-radius:99px}
  .sidebar-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;background:transparent;border:none;border-radius:7px;cursor:pointer;font:inherit;font-size:12px;color:#5b6167;text-align:left;transition:background .15s,color .15s;margin-bottom:1px}
  .sidebar-item:hover{background:#f4f5f8;color:#0d0d0d}
  .sidebar-item.active{background:#eef1ff;color:#2a3ea8;font-weight:600}
  .sidebar-item.active .num{color:#4d6bfe}
  .sidebar-item.done .num{color:#2f9e6b}
  .sidebar-item.locked{opacity:.4;cursor:not-allowed}
  .sidebar-item.locked:hover{background:transparent;color:#5b6167}
  .sidebar-item .num{font:700 10px ui-monospace,SFMono-Regular,monospace;color:#b6bcc3;flex:0 0 auto;width:16px}
  .sidebar-item .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .sidebar-item .check{font-size:11px;color:#2f9e6b;opacity:0;flex:0 0 auto}
  .sidebar-item.done .check{opacity:1}
  .sidebar-foot{flex:0 0 auto;padding:11px 16px 14px;border-top:1px solid #f0f1f4;display:flex;flex-direction:column;gap:7px}
  .sidebar-progress{display:flex;align-items:center;gap:9px}
  .prog{flex:1;height:5px;background:#eceef2;border-radius:99px;overflow:hidden;min-width:0}
  .prog-fill{height:100%;width:0;background:#4d6bfe;border-radius:99px;transition:width .4s ease}
  .prog-label{font:600 11px ui-monospace,SFMono-Regular,monospace;color:#5b6167;white-space:nowrap}
  .link{background:none;border:none;color:#8b9096;cursor:pointer;font:inherit;font-size:11px;padding:0;text-align:left}
  .link:hover{color:#4d6bfe;text-decoration:underline}
  main{flex:1 1 auto;min-width:0;padding:22px 32px 60px}
  .card{max-width:980px;margin:0 auto;background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:18px 20px 18px;box-shadow:0 1px 2px rgba(13,13,13,.04);animation:pop .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .eyebrow{font:600 10.5px ui-monospace,monospace;color:#4d6bfe;letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
  h2{margin:0 0 10px;font-size:17px;letter-spacing:-.01em}
  .pill{float:right;font:600 10px ui-monospace,monospace;color:#5b6167;background:#f2f3f6;border-radius:99px;padding:2px 8px}
  .theory{margin:0 0 11px;padding-left:16px;color:#2b2f33;font-size:12.5px}
  .theory li{margin:3px 0}
  .theory b{color:#0d0d0d}
  .theory .katex{font-size:1.05em}
  .real{background:#f6f8ff;border:1px solid #e3e9ff;border-radius:8px;padding:8px 10px;font-size:12px;color:#2a3550;margin-bottom:12px}
  .real .tag{display:inline-block;font:700 9.5px ui-monospace,monospace;color:#4d6bfe;background:#fff;border:1px solid #dde4ff;border-radius:4px;padding:1px 5px;margin-right:5px;vertical-align:1px}
  .cv{width:100%;display:block;border:1px solid #eceef2;border-radius:8px;background:#fff}
  .formula-block{
    background:#0d0d0d;color:#f4f5f8;border-radius:8px;
    padding:14px 16px;margin:10px 0 12px;
    display:flex;flex-direction:column;gap:8px;
  }
  .formula-block .katex{color:#f4f5f8;font-size:1.15em}
  .formula-block .fb-label{font:600 10.5px ui-monospace,monospace;color:#8fb0ff;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
  .ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:7px 15px;margin-top:11px}
  .ctrl{display:block;font-size:11.5px}
  .ctrl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;color:#5b6167;font-weight:550}
  .ctrl-head .val{font:600 11px ui-monospace,monospace;color:#4d6bfe}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:99px;background:#eceef2;outline:none;margin:5px 0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#4d6bfe;border:2px solid #fff;box-shadow:0 1px 3px rgba(77,107,254,.45);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#4d6bfe;border:2px solid #fff;cursor:pointer}
  select,input[type=text],input[type=number]{width:100%;padding:5px 8px;border:1px solid #e0e3e8;border-radius:7px;font:inherit;font-size:12px;background:#fff;color:#0d0d0d;outline:none}
  select:focus,input:focus{border-color:#4d6bfe;box-shadow:0 0 0 3px #eef1ff}
  .row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .b{font:600 12px inherit;padding:6px 12px;border-radius:8px;border:1px solid #4d6bfe;background:#4d6bfe;color:#fff;cursor:pointer;transition:.15s}
  .b:hover{background:#3a56e0;border-color:#3a56e0}
  .b:active{transform:scale(.97)}
  .b.ghost{background:#fff;color:#4d6bfe}
  .b.ghost:hover{background:#f5f7ff}
  .b:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .readout{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .stat{font:600 11px ui-monospace,monospace;background:#f4f5f8;border-radius:6px;padding:5px 9px;color:#3b4148;display:inline-flex;align-items:center;gap:4px}
  .stat em{font-style:normal;color:#8b9096;font-weight:500}
  .stat.hi{background:#eef1ff;color:#2a3ea8}
  .stat .katex{font-size:1.05em}
  .quiz{margin-top:18px;border-top:1px solid #eef0f3;padding-top:13px}
  .quiz-title{font:700 10.5px ui-monospace,monospace;color:#8b9096;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
  .q{margin-bottom:11px}
  .q-text{font-weight:600;font-size:13px;margin-bottom:6px}
  .q-text .katex{font-size:1.05em}
  .opts{display:flex;flex-direction:column;gap:5px}
  .opt{text-align:left;font:inherit;font-size:12.5px;padding:6px 10px;border:1px solid #e5e5e5;background:#fff;border-radius:7px;cursor:pointer;color:#2b2f33;transition:.15s}
  .opt:hover{border-color:#c9d2ff;background:#fafbff}
  .opt.good{border-color:#2f9e6b;background:#f2fbf6;color:#1f7a52;font-weight:600}
  .opt.bad{border-color:#e05555;background:#fdf3f3;animation:shake .3s}
  .opt .katex{font-size:1.02em}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .why{font-size:11.5px;color:#1f7a52;margin-top:5px;padding-left:2px}
  .why .katex{font-size:1.02em}
  .finish{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .finish .hint{font-size:11.5px;color:#8b9096}
  .bars{display:flex;gap:16px;align-items:flex-end;height:150px;margin:12px 0 6px;padding:0 6px}
  .barcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
  .barfill{width:100%;max-width:52px;border-radius:5px 5px 0 0;transition:height .09s linear}
  .barlabel{font:600 10.5px ui-monospace,monospace;color:#5b6167;margin-top:5px;text-align:center}
  .barlabel .katex{font-size:1.05em}
  .barval{font:600 10.5px ui-monospace,monospace;color:#0d0d0d;margin-bottom:3px}
  pre.code{background:#0d0d0d;color:#e8eaf0;border-radius:8px;padding:11px;overflow:auto;font:11.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;margin:0}
  .tree{font:11.5px/1.65 ui-monospace,monospace;color:#2b2f33;white-space:pre;overflow:auto}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:880px){.two{grid-template-columns:1fr}}
  .done-badge{background:#f2fbf6;border:1px solid #c8e8d8;color:#1f7a52;border-radius:6px;padding:3px 8px;font:600 11px ui-monospace,monospace}
  .err-card{background:#fdf3f3;border:1px solid #f5c6c6;border-radius:8px;padding:10px 12px;color:#a83131;font-size:12px}
  .err-card b{color:#7a1f1f}
  @media(max-width:720px){
    body{flex-direction:column}
    .sidebar{position:static;width:100%;flex:0 0 auto;height:auto;min-height:0;border-right:none;border-bottom:1px solid #e5e5e5}
    .sidebar-head{padding:10px 12px 8px}
    .sidebar-list{flex:0 0 auto;display:flex;flex-direction:row;gap:4px;overflow-x:auto;overflow-y:hidden;padding:6px 10px;min-height:0}
    .sidebar-item{flex:0 0 auto;width:auto;padding:6px 10px;margin-bottom:0}
    .sidebar-item .label{max-width:100px}
    .sidebar-item .check{display:none}
    .sidebar-foot{flex-direction:row;align-items:center;padding:8px 12px 10px;gap:10px}
    .sidebar-progress{flex:1}
    .link{margin-left:auto}
    main{padding:14px 14px 40px}
    .card{padding:14px 14px 16px}
    h2{font-size:16px}
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-head">
    <div class="brand"><span class="dot"></span>Playground Physique</div>
    <div class="brand-sub">12 sprints · 20 min</div>
  </div>
  <nav class="sidebar-list" id="rail"></nav>
  <div class="sidebar-foot">
    <div class="sidebar-progress">
      <div class="prog"><div class="prog-fill" id="progFill"></div></div>
      <div class="prog-label" id="progLabel">0 / 12</div>
    </div>
    <button id="resetAll" class="link">Réinitialiser</button>
  </div>
</aside>

<main id="stage"></main>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script>
window.addEventListener('error', e => {
  console.error('[playground] uncaught:', e.error || e.message);
});

const el = (t,c,h) => { const e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e; };
const stage = document.getElementById('stage');
const rail  = document.getElementById('rail');
const progFill = document.getElementById('progFill');
const progLabel = document.getElementById('progLabel');

const C = { blue:'#4d6bfe', ink:'#0d0d0d', grey:'#9aa0a6', light:'#d1d5db',
            orange:'#e8833a', green:'#2f9e6b', red:'#e05555',
            carBlue:'#4d6bfe', carDark:'#2a3ea8', carWin:'#bcd2ff',
            road:'#e0e3e8', grass:'#eaf5ea' };

/* ---------- KaTeX helpers ---------- */
function renderMath(container){
  if(!container || typeof renderMathInElement === 'undefined') return;
  try {
    renderMathInElement(container, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ],
      throwOnError: false,
      errorColor: '#c0c6cc'
    });
  } catch(e){ console.warn('[katex] render failed', e); }
}

function renderTeX(target, tex, display){
  if(!target) return;
  if(typeof katex === 'undefined'){
    target.textContent = tex;
    return;
  }
  try {
    katex.render(tex, target, {throwOnError: false, displayMode: !!display});
  } catch(e){
    target.textContent = tex;
  }
}

function katexStat(parent, tex, cls){
  const stat = el('span', 'stat' + (cls ? ' ' + cls : ''));
  const slot = el('span');
  stat.appendChild(slot);
  parent.appendChild(stat);
  renderTeX(slot, tex, false);
  return { stat, slot, update(t){ renderTeX(slot, t, false); } };
}

function formulaBlock(parent, entries){
  const block = el('div','formula-block');
  entries.forEach(({label, tex})=>{
    const wrap = el('div');
    if(label) wrap.appendChild(el('div','fb-label', label));
    const slot = el('div');
    wrap.appendChild(slot);
    block.appendChild(wrap);
    renderTeX(slot, tex, true);
  });
  parent.appendChild(block);
  return block;
}

/* ---------- Canvas ---------- */
function mkCanvas(host, h=250){
  const c = document.createElement('canvas');
  c.className = 'cv';
  c.style.height = h + 'px';
  host.appendChild(c);
  const ctx = c.getContext('2d');
  function fit(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = c.clientWidth || 600;
    c.width  = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  fit();
  const ro = new ResizeObserver(fit); ro.observe(c);
  return { c, ctx, fit, H:h, stop(){ ro.disconnect(); } };
}

function loop(fn){
  let alive = true, raf = 0, last = performance.now();
  function tick(now){
    if(!alive) return;
    const dt = Math.min(0.05, (now-last)/1000); last = now;
    try{ fn(dt); }catch(e){ console.error('[playground] frame error:', e); }
    raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);
  return () => { alive = false; cancelAnimationFrame(raf); };
}

function btn(parent, label, cls=''){
  const b = el('button','b '+cls, label);
  parent.appendChild(b);
  return b;
}

function makeSlider(parent, o){
  const wrap = el('label','ctrl');
  const head = el('div','ctrl-head');
  const fmt = o.fmt || (v => String(v));
  const out = el('span','val', fmt(o.value) + (o.unit||''));
  head.append(el('span',null,o.label), out);
  wrap.appendChild(head);
  const inp = el('input'); inp.type='range';
  inp.min=o.min; inp.max=o.max; inp.step=o.step; inp.value=o.value;
  wrap.appendChild(inp);
  parent.appendChild(wrap);
  const fns = [];
  inp.addEventListener('input', ()=>{
    out.textContent = fmt(+inp.value) + (o.unit||'');
    fns.forEach(f => f(+inp.value));
  });
  return {
    get value(){ return +inp.value; },
    on(f){ fns.push(f); return this; },
    set(v){ inp.value = v; out.textContent = fmt(+inp.value)+(o.unit||''); }
  };
}

function makeSelect(parent, o){
  const wrap = el('label','ctrl');
  wrap.appendChild(el('div','ctrl-head','<span>'+o.label+'</span>'));
  const s = el('select');
  o.options.forEach(([v,l])=>{ const op=el('option',null,l); op.value=v; s.appendChild(op); });
  s.value = o.value;
  wrap.appendChild(s);
  parent.appendChild(wrap);
  const fns = [];
  s.addEventListener('change', ()=> fns.forEach(f => f(s.value)));
  return { get value(){ return s.value; }, on(f){ fns.push(f); return this; } };
}

/* ---------- Draw helpers ---------- */
function arrow(ctx,x1,y1,x2,y2,color,label){
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy);
  if(len < 2) return;
  ctx.save();
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=2; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const a = Math.atan2(dy,dx), s = 7;
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2 - s*Math.cos(a-0.42), y2 - s*Math.sin(a-0.42));
  ctx.lineTo(x2 - s*Math.cos(a+0.42), y2 - s*Math.sin(a+0.42));
  ctx.closePath(); ctx.fill();
  if(label){
    ctx.font='600 11px ui-monospace,monospace';
    ctx.fillText(label, x2 + 7, y2 - 7);
  }
  ctx.restore();
}

function dot(ctx,x,y,r,color){
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle = color; ctx.fill();
}

function txt(ctx,s,x,y,color='#5b6167',font='600 11.5px ui-monospace,monospace'){
  ctx.save(); ctx.fillStyle=color; ctx.font=font; ctx.textBaseline='top';
  ctx.fillText(s,x,y); ctx.restore();
}

/* ---------- SVG-style objects ---------- */
function drawCar(ctx, cx, cy, w, opts={}){
  const { flip=false, color=C.carBlue, dark=C.carDark, accent='#ffe066' } = opts;
  const s = w / 110;
  ctx.save();
  ctx.translate(cx, cy);
  if(flip) ctx.scale(-1, 1);
  ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.beginPath(); ctx.ellipse(0, 24, 52, 4, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = color;
  ctx.strokeStyle = dark;
  ctx.lineWidth = 1.5;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(-52, 10);
  ctx.quadraticCurveTo(-52, 0, -42, -2);
  ctx.lineTo(-18, -2);
  ctx.lineTo(-8, -20);
  ctx.quadraticCurveTo(-2, -22, 10, -22);
  ctx.quadraticCurveTo(20, -20, 26, -2);
  ctx.lineTo(42, -2);
  ctx.quadraticCurveTo(52, 0, 52, 10);
  ctx.lineTo(52, 16);
  ctx.quadraticCurveTo(52, 19, 48, 19);
  ctx.lineTo(-48, 19);
  ctx.quadraticCurveTo(-52, 19, -52, 16);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.carWin;
  ctx.strokeStyle = dark;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-16, -2); ctx.lineTo(-7, -18); ctx.lineTo(2, -18); ctx.lineTo(2, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(6, -2); ctx.lineTo(6, -18); ctx.lineTo(9, -18);
  ctx.quadraticCurveTo(16, -17, 23, -2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = accent;
  ctx.beginPath(); ctx.arc(50, 5, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(-30, 19, 9, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 30, 19, 9, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#9a9a9a';
  ctx.beginPath(); ctx.arc(-30, 19, 3.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 30, 19, 3.5, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawCarTop(ctx, cx, cy, w, angle){
  const s = w / 60;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(-32, -17, 64, 34, 8);
  else ctx.rect(-32, -17, 64, 34);
  ctx.fill();
  ctx.fillStyle = C.carBlue;
  ctx.strokeStyle = C.carDark;
  ctx.lineWidth = 2;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(-30, -15, 60, 30, 6);
  else ctx.rect(-30, -15, 60, 30);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.carWin;
  ctx.beginPath();
  ctx.moveTo(14, -12); ctx.lineTo(24, -8); ctx.lineTo(24, 8); ctx.lineTo(14, 12);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-24, -8); ctx.lineTo(-16, -12); ctx.lineTo(-16, 12); ctx.lineTo(-24, 8);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffe066';
  ctx.beginPath(); ctx.arc(28, -8, 2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(28, 8, 2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(-22, -18, 6, 4); ctx.fillRect(16, -18, 6, 4);
  ctx.fillRect(-22, 14, 6, 4);  ctx.fillRect(16, 14, 6, 4);
  ctx.restore();
}

function drawBasketball(ctx, cx, cy, r){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = '#e8833a';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#5a2000';
  ctx.lineWidth = Math.max(1, r*0.06);
  ctx.beginPath(); ctx.arc(0, 0, r*0.95, 0, Math.PI*2); ctx.stroke();
  ctx.lineWidth = Math.max(0.8, r*0.045);
  ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-r*0.95, 0); ctx.quadraticCurveTo(0, r*0.32, r*0.95, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-r*0.95, 0); ctx.quadraticCurveTo(0, -r*0.32, r*0.95, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-r*0.5, -r*0.85); ctx.quadraticCurveTo(-r*0.85, 0, -r*0.5, r*0.85); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(r*0.5, -r*0.85); ctx.quadraticCurveTo(r*0.85, 0, r*0.5, r*0.85); ctx.stroke();
  ctx.restore();
}

function drawHoop(ctx, x, y, size){
  ctx.strokeStyle = '#7a8088';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x, y + size*1.6); ctx.lineTo(x, y + size*0.2); ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#5b6167';
  ctx.lineWidth = 2;
  ctx.fillRect(x - size*0.5, y - size*0.9, size*0.9, size*0.7);
  ctx.strokeRect(x - size*0.5, y - size*0.9, size*0.9, size*0.7);
  ctx.strokeStyle = '#c9ced4';
  ctx.lineWidth = 1;
  ctx.strokeRect(x - size*0.2, y - size*0.7, size*0.4, size*0.32);
  ctx.strokeStyle = '#e8833a';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(x, y + size*0.2, size*0.42, size*0.09, 0, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = '#c0c6cc';
  ctx.lineWidth = 1;
  for(let i = 0; i < 9; i++){
    const a = (i/9) * Math.PI * 2;
    const x1 = x + Math.cos(a) * size*0.42;
    const y1 = y + size*0.2 + Math.sin(a) * size*0.09;
    const x2 = x + Math.cos(a) * size*0.16;
    const y2 = y + size*0.55;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
}

function drawCart(ctx, cx, cy, w, opts={}){
  const { filled=false, color='#5b6167' } = opts;
  const s = w / 80;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.beginPath(); ctx.ellipse(0, 22, 32, 3, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(-28, -18); ctx.lineTo(28, -18);
  ctx.lineTo(22, 12); ctx.lineTo(-22, 12);
  ctx.closePath(); ctx.stroke();
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-27, -8); ctx.lineTo(27, -8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-25, 2);  ctx.lineTo(25, 2);  ctx.stroke();
  if(filled){
    ctx.fillStyle = '#c9d2ff';
    ctx.strokeStyle = '#4d6bfe';
    ctx.lineWidth = 1;
    for(let row = 0; row < 2; row++){
      for(let i = 0; i < 3; i++){
        const x = -20 + i*14;
        const y = -16 + row*9;
        ctx.fillRect(x, y, 12, 8);
        ctx.strokeRect(x, y, 12, 8);
      }
    }
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-28, -18); ctx.lineTo(-34, -28); ctx.lineTo(-42, -28); ctx.stroke();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(-16, 18, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 16, 18, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#9a9a9a';
  ctx.beginPath(); ctx.arc(-16, 18, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 16, 18, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawPusher(ctx, cx, cy, w, opts={}){
  const { flip=false, color='#4d6bfe' } = opts;
  const s = w / 40;
  ctx.save();
  ctx.translate(cx, cy);
  if(flip) ctx.scale(-1, 1);
  ctx.scale(s, s);
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, -20, 6.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(0, 8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(16, -2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(16, 2);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(-6, 22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo( 5, 22); ctx.stroke();
  ctx.restore();
}

function drawSquashBall(ctx, cx, cy, r){
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#7a7a7a';
  ctx.beginPath(); ctx.arc(cx - r*0.3, cy - r*0.3, r*0.32, 0, Math.PI*2); ctx.fill();
}

function drawBilliardBall(ctx, cx, cy, r, color, number){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.beginPath(); ctx.ellipse(2, 4, r*1.1, r*0.35, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
  const g = ctx.createRadialGradient(-r*0.35, -r*0.35, r*0.1, 0, 0, r);
  g.addColorStop(0, 'rgba(255,255,255,0.55)');
  g.addColorStop(0.55, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
  if(number){
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(0, 0, r*0.42, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold ' + (r*0.55) + 'px ui-monospace,monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(number), 0, 0);
  } else {
    ctx.fillStyle = '#e05555';
    ctx.beginPath(); ctx.arc(0, 0, r*0.14, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawBall(ctx, cx, cy, r, color){
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.arc(cx - r*0.3, cy - r*0.3, r*0.35, 0, Math.PI*2); ctx.fill();
}

      ['semi','Semi-implicite (v puis r)'],['explicit','Explicite (r puis v)']

      why:'$U = mgz$ est maximale quand $z$ est maximal, et $E_c = 0$ puisque $v = 0$.' }
  ],
  mount(host){
    const {c, ctx, stop} = mkCanvas(host, 240);
    const bars = el('div','bars'); host.appendChild(bars);
    const mkBar = (labelTex,color)=>{
      const col = el('div','barcol');
      const val = el('div','barval','0 %');
      const fill = el('div','barfill'); fill.style.background=color; fill.style.height='0%';
      const lab = el('div','barlabel');
      const labSpan = el('span'); lab.appendChild(labSpan);
      renderTeX(labSpan, labelTex, false);
      col.append(val,fill,lab); bars.appendChild(col);
      return {fill,val};
    };
    const bC = mkBar('E_c','#c9d2ff');
    const bU = mkBar('U','#c8e8d8');
    const bM = mkBar('E_m',C.blue);

    const bar = el('div','ctrls'); host.appendChild(bar);
    const g = 9.81, m = 1;
    let h0 = 8, e = 0.75;
    let z = h0, vz = 0, lost = 0, bounces = 0, restTimer = 0;

    const sh = makeSlider(bar,{label:'Hauteur de départ', min:2, max:12, step:0.5, value:h0, unit:' m', fmt:x=>x.toFixed(1)});
    const se = makeSlider(bar,{label:'Coefficient de rebond e', min:0.2, max:1, step:0.05, value:e, fmt:x=>x.toFixed(2)});
    const row = el('div','row'); bar.appendChild(row);
    const bR = btn(row,'↺ Relancer','ghost');
    sh.on(x=>{ h0=x; reset(); }); se.on(x=>{ e=x; reset(); });
    bR.onclick = reset;
    function reset(){ z=h0; vz=0; lost=0; bounces=0; restTimer=0; }

    const E0 = () => m*g*h0;

    const stopLoop = loop(dt=>{
      const w = c.clientWidth, h = c.clientHeight;
      vz -= g*dt;
      z += vz*dt;
      if(z < 0){
        const impact = Math.abs(vz);
        lost += 0.5*m*impact*impact*(1-e*e);
        z = 0;
        vz = -vz*e;
        bounces++;
        if(Math.abs(vz) < 0.8){ vz = 0; }
      }
      if(z <= 0.001 && Math.abs(vz) < 0.01){
        restTimer += dt;
        if(restTimer > 1.4) reset();
      }

      const Ec = 0.5*m*vz*vz;
      const U  = m*g*Math.max(z,0);
      const Em = Ec + U;
      const den = Math.max(E0(), 0.001);

      bC.fill.style.height = Math.min(100, Ec/den*100)+'%';
      bU.fill.style.height = Math.min(100, U/den*100)+'%';
      bM.fill.style.height = Math.min(100, Em/den*100)+'%';
      bC.val.textContent = Ec.toFixed(1)+' J';
      bU.val.textContent = U.toFixed(1)+' J';
      bM.val.textContent = Em.toFixed(1)+' J';

      ctx.clearRect(0,0,w,h);
      const ground = h - 24;
      const pxm = (h - 46) / 12;
      const X = w * 0.5;

      ctx.fillStyle = '#f0f1f4';
      ctx.fillRect(0, ground, w, 24);
      ctx.strokeStyle = '#e0e3e8';
      ctx.beginPath(); ctx.moveTo(0, ground); ctx.lineTo(w, ground); ctx.stroke();

      ctx.setLineDash([4,4]);
      ctx.strokeStyle='#eef1ff';
      ctx.beginPath(); ctx.moveTo(20, ground - h0*pxm); ctx.lineTo(w-20, ground - h0*pxm); ctx.stroke();
      ctx.setLineDash([]);
      txt(ctx, 'h₀ = ' + h0.toFixed(1) + ' m', 20, ground - h0*pxm - 14, '#c3c8ce');

      const Y = ground - Math.max(z,0)*pxm;
      drawBasketball(ctx, X, Y, 12);

      arrow(ctx, X + 18, Y, X + 18, Y + vz*3, vz>0 ? C.green : C.orange, 'v');

      txt(ctx, 'z = ' + Math.max(z,0).toFixed(2) + ' m', 10, 10, C.ink);
      txt(ctx, 'chocs : ' + bounces + ' · perdu : ' + lost.toFixed(1) + ' J', 10, 28, '#8b9096');
    });

    return ()=>{ stopLoop(); stop(); };
  }
});

    const row = el('div','row'); wrap.appendChild(row);

    msg.innerHTML = '<span class="tag">pipeline</span> Clique les étapes dans le bon ordre pour construire le rendu.';

    shuffled.forEach(s => {
      const b = btn(row, s.label, 'ghost');
      b.onclick = ()=>{
        if(progress >= STEPS.length) return;
        if(s.id === STEPS[progress].id){
          b.style.borderColor = '#2f9e6b';
          b.style.color = '#1f7a52';
          b.style.background = '#f2fbf6';
          b.disabled = true;
          progress++;
          msg.innerHTML = progress === STEPS.length
            ? '<span class="tag">terminé</span> Rendu complet. Les sphères sont dimensionnées par <b>radius</b>.'
            : '<span class="tag">étape ' + progress + '/5</span> ' + STEPS[progress].label + ' — à toi.';
        } else {
          b.style.animation = 'shake .3s';
          setTimeout(()=>b.style.animation='', 320);
          msg.innerHTML = '<span class="tag" style="color:#e05555;border-color:#f5c6c6">erreur</span> Il faut d\'abord « ' + STEPS[progress].label + ' ».';
        }
      };
    });

    const parts = [];
    for(let i=0;i<60;i++){
      parts.push({ x:Math.random(), y:Math.random(), r:0.4+Math.random()*1.2, ph:Math.random()*6.28 });
    }

    const stopLoop = loop(()=>{
      const w = c.clientWidth, h = c.clientHeight;
      ctx.clearRect(0,0,w,h);

      if(progress === 0){
        txt(ctx,'Aucune donnée chargée', w/2-70, h/2-8, '#c3c8ce');
        return;
      }

      const cx = w/2, cy = h/2;
      const S = Math.min(w,h)*0.62;

      ctx.strokeStyle='#f3f4f7'; ctx.lineWidth=1;
      for(let i=-2;i<=2;i++){
        ctx.beginPath(); ctx.moveTo(cx-S*0.55, cy+i*S*0.22); ctx.lineTo(cx+S*0.55, cy+i*S*0.22); ctx.stroke();
      }

      const bx = S*0.5, by = S*0.34, skew = S*0.18;
      ctx.strokeStyle = progress >= 2 ? C.blue : '#d1d5db';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(cx-bx, cy-by); ctx.lineTo(cx+bx, cy-by);
      ctx.lineTo(cx+bx, cy+by); ctx.lineTo(cx-bx, cy+by); ctx.closePath();
      ctx.stroke();
      if(progress >= 2){
        ctx.beginPath();
        ctx.moveTo(cx-bx, cy-by); ctx.lineTo(cx-bx+skew, cy-by-skew*0.6);
        ctx.lineTo(cx+bx+skew, cy-by-skew*0.6); ctx.lineTo(cx+bx, cy-by);
        ctx.stroke();
      }

      if(progress >= 3){
        const t = performance.now()/1000;
        parts.forEach(p=>{
          const moved = progress >= 5;
          const px = moved ? (p.x + Math.sin(t*0.6 + p.ph)*0.06) : p.x;
          const py = moved ? (p.y + Math.cos(t*0.5 + p.ph)*0.06) : p.y;
          const X = cx - bx + px*2*bx;
          const Y = cy - by + py*2*by;
          const R = progress >= 4 ? p.r*3.2 : 2.4;
          ctx.beginPath(); ctx.arc(X, Y, R, 0, Math.PI*2);
          if(progress >= 4){
            const k = Math.min(1, p.r/1.6);
            ctx.fillStyle = 'rgba(' + (77 + 60*k) + ',' + (107 + 40*k) + ',254,' + (0.35 + 0.5*k) + ')';
          } else {
            ctx.fillStyle = 'rgba(150,158,170,.75)';
          }
          ctx.fill();
        });
      }

      if(progress >= 5){
        txt(ctx,'▶ animation en cours', 10, 10, C.blue);
      }
      txt(ctx,'pipeline : ' + progress + '/5', 10, h-20, '#8b9096');
    });

    return ()=>{ stopLoop(); stop(); };
  }
});

/* ============================================================
   STATE
   ============================================================ */
const KEY = 'playground_physique_v3';
let state = { done: [] };
try{
  const raw = localStorage.getItem(KEY) || localStorage.getItem('playground_physique_v2') || localStorage.getItem('playground_physique_v1');
  if(raw){
    const p = JSON.parse(raw);
    if(p && Array.isArray(p.done)) state = { done: p.done.filter(x => Number.isInteger(x) && x >= 0 && x < SPRINTS.length) };
  }
}catch(e){ console.warn('[playground] state parse failed', e); }

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
const isUnlocked = i => i === 0 || state.done.includes(i-1);

let current = 0;
let cleanup = null;

function renderRail(){
  rail.innerHTML = '';
  SPRINTS.forEach((s,i)=>{
    const b = el('button','sidebar-item');
    const done = state.done.includes(i);
    const locked = !isUnlocked(i);
    b.innerHTML =
      '<span class="num">' + String(i+1).padStart(2,'0') + '</span>' +
      '<span class="label">' + s.short + '</span>' +
      '<span class="check">✓</span>';
    if(done) b.classList.add('done');
    if(i === current) b.classList.add('active');
    if(locked) b.classList.add('locked');
    b.onclick = ()=>{ if(isUnlocked(i)) open(i); };
    rail.appendChild(b);
  });
  const p = SPRINTS.length ? (state.done.length / SPRINTS.length * 100) : 0;
  progFill.style.width = p + '%';
  progLabel.textContent = state.done.length + ' / ' + SPRINTS.length;
}

function renderBilan(){
  current = SPRINTS.length;
  stage.innerHTML = '';
  const card = el('div','card');
  card.innerHTML = '<div class="eyebrow">Parcours terminé<span class="pill">12 / 12</span></div>' +
    '<h2>🎉 Les 12 sprints sont validés</h2>' +
    '<ul class="theory">' +
    '<li>Cinématique : position, vitesse, accélération, balistique, MCU.</li>' +
    '<li>Dynamique : 3 lois de Newton, différences finies, réflexion aux bords.</li>' +
    '<li>Énergie : travail, énergie mécanique, collisions élastiques.</li>' +
    '<li>Logiciel : classes Python, export HDF5/XDMF, ParaView.</li>' +
    '</ul>' +
    '<div class="real"><span class="tag">prochaine étape</span>Ouvre ton vrai projet Python et écris la classe <b>Atome</b> avec <code>np.array</code> pour position et vitesse.</div>';
  stage.appendChild(card);
  renderRail();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function open(i){
  if(i === SPRINTS.length){
    if(cleanup){ try{ cleanup(); }catch(e){} cleanup = null; }
    renderBilan();
    return;
  }
  if(!SPRINTS[i]) return;

  if(cleanup){ try{ cleanup(); }catch(e){} cleanup = null; }
  current = i;
  const s = SPRINTS[i];
  stage.innerHTML = '';

  const card = el('div','card');
  const eyebrow = el('div','eyebrow', s.tag);
  eyebrow.innerHTML += '<span class="pill">20 min</span>';
  card.appendChild(eyebrow);
  card.appendChild(el('h2', null, s.title));

  const theory = el('ul','theory');
  s.theory.forEach(t => theory.appendChild(el('li', null, t)));
  card.appendChild(theory);

  card.appendChild(el('div','real', '<span class="tag">Monde réel</span>' + s.real));

  if(s.formulas && s.formulas.length){
    formulaBlock(card, s.formulas);
  }

  const play = el('div','play');
  card.appendChild(play);

  const qz = el('div','quiz');
  qz.appendChild(el('div','quiz-title','Vérifie que c\'est ancré'));
  const answered = new Array(s.quiz.length).fill(false);

  const finishRow = el('div','finish');
  const finishBtn = el('button','b','Terminer le sprint ✓');
  finishBtn.disabled = true;
  const hint = el('div','hint','Réponds juste aux questions pour valider.');

  s.quiz.forEach((q, qi)=>{
    const box = el('div','q');
    box.appendChild(el('div','q-text', (qi+1) + '. ' + q.q));
    const opts = el('div','opts');
    q.opts.forEach((o, oi)=>{
      const b = el('button','opt', o);
      b.onclick = ()=>{
        if(box.classList.contains('ok')) return;
        if(oi === q.a){
          b.classList.add('good');
          box.classList.add('ok');
          box.appendChild(el('div','why', '✓ ' + q.why));
          answered[qi] = true;
          if(answered.every(Boolean)){
            finishBtn.disabled = false;
            hint.textContent = 'Tout est bon — valide le sprint.';
          }
        } else {
          b.classList.add('bad');
          setTimeout(()=>b.classList.remove('bad'), 400);
        }
      };
      opts.appendChild(b);
    });
    box.appendChild(opts);
    qz.appendChild(box);
  });

  finishBtn.onclick = ()=>{
    if(!state.done.includes(i)) state.done.push(i);
    save();
    finishBtn.textContent = '✓ Sprint validé';
    finishBtn.disabled = true;
    hint.innerHTML = '<span class="done-badge">+1 sprint</span> Prochain débloqué…';
    renderRail();
    setTimeout(()=>{
      if(i+1 < SPRINTS.length) open(i+1);
      else open(SPRINTS.length);
    }, 800);
  };

  finishRow.append(finishBtn, hint);
  qz.appendChild(finishRow);
  card.appendChild(qz);
  stage.appendChild(card);

  renderMath(card);

  try {
    cleanup = s.mount(play) || null;
  } catch(e){
    console.error('[playground] mount failed for sprint', i+1, e);
    const errBox = el('div','err-card');
    errBox.innerHTML = '<b>Ce playground n\'a pas pu s\'initialiser.</b><br>Le reste fonctionne : tu peux répondre au quiz et valider. Détail en console : <code>' + ((e && e.message) || e) + '</code>';
    play.appendChild(errBox);
    cleanup = null;
  }

  renderRail();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('resetAll').onclick = ()=>{
  if(!confirm('Effacer toute la progression ?')) return;
  state = { done: [] };
  save();
  open(0);
};

/* ---------- démarrage ---------- */
renderRail();
let startAt = 0;
for(let i=0;i<SPRINTS.length;i++){ if(!state.done.includes(i)){ startAt = i; break; } }
if(state.done.length >= SPRINTS.length) startAt = SPRINTS.length;
open(startAt);
</script>
