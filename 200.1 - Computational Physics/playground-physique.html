<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Playground Physique — 12 sprints</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font:11px/1.4 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
    background:#f7f8fa;color:#0d0d0d;
    -webkit-font-smoothing:antialiased;
    display:flex;
    min-height:100vh;
    min-height:100dvh;
  }

  /* ---------- sidebar ---------- */
  .sidebar{
    position:sticky;top:0;
    width:180px;flex:0 0 180px;
    height:100vh;height:100dvh;
    background:#fff;
    border-right:1px solid #e5e5e5;
    display:flex;flex-direction:column;
    z-index:10;
  }
  .sidebar-head{
    flex:0 0 auto;
    padding:9px 11px 7px;
    border-bottom:1px solid #f0f1f4;
  }
  .brand{display:flex;align-items:center;gap:6px;font-weight:650;font-size:11px;color:#0d0d0d}
  .brand .dot{width:6px;height:6px;border-radius:50%;background:#4d6bfe;flex:0 0 auto}
  .brand-sub{color:#8b9096;font-weight:500;font-size:9.5px;margin-top:1px;padding-left:12px}

  .sidebar-list{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:5px;
  }
  .sidebar-list::-webkit-scrollbar{width:4px}
  .sidebar-list::-webkit-scrollbar-thumb{background:#e0e3e8;border-radius:99px}

  .sidebar-item{
    display:flex;align-items:center;gap:6px;
    width:100%;padding:4px 6px;
    background:transparent;border:none;border-radius:5px;
    cursor:pointer;font:inherit;font-size:10px;color:#5b6167;
    text-align:left;transition:background .15s,color .15s;
    margin-bottom:0;
  }
  .sidebar-item:hover{background:#f4f5f8;color:#0d0d0d}
  .sidebar-item.active{background:#eef1ff;color:#2a3ea8;font-weight:600}
  .sidebar-item.active .num{color:#4d6bfe}
  .sidebar-item.done .num{color:#2f9e6b}
  .sidebar-item.locked{opacity:.4;cursor:not-allowed}
  .sidebar-item.locked:hover{background:transparent;color:#5b6167}
  .sidebar-item .num{
    font:700 9px ui-monospace,SFMono-Regular,monospace;
    color:#b6bcc3;flex:0 0 auto;width:13px;
  }
  .sidebar-item .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .sidebar-item .check{font-size:9px;color:#2f9e6b;opacity:0;flex:0 0 auto}
  .sidebar-item.done .check{opacity:1}

  .sidebar-foot{
    flex:0 0 auto;
    padding:7px 11px 9px;
    border-top:1px solid #f0f1f4;
    display:flex;flex-direction:column;gap:4px;
  }
  .sidebar-progress{display:flex;align-items:center;gap:6px}
  .prog{flex:1;height:3px;background:#eceef2;border-radius:99px;overflow:hidden;min-width:0}
  .prog-fill{height:100%;width:0;background:#4d6bfe;border-radius:99px;transition:width .4s ease}
  .prog-label{font:600 9px ui-monospace,SFMono-Regular,monospace;color:#5b6167;white-space:nowrap}
  .link{background:none;border:none;color:#8b9096;cursor:pointer;font:inherit;font-size:9px;padding:0;text-align:left}
  .link:hover{color:#4d6bfe;text-decoration:underline}

  /* ---------- main ---------- */
  main{
    flex:1 1 auto;
    min-width:0;
    padding:12px 20px 40px;
  }
  .card{
    max-width:100%;
    margin:0 auto;
    background:#fff;
    border:1px solid #e5e5e5;
    border-radius:9px;
    padding:11px 13px 11px;
    box-shadow:0 1px 2px rgba(13,13,13,.04);
    animation:pop .22s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes pop{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

  .eyebrow{font:600 9px ui-monospace,monospace;color:#4d6bfe;letter-spacing:.04em;text-transform:uppercase;margin-bottom:1px}
  h2{margin:0 0 6px;font-size:14px;letter-spacing:-.01em}
  .pill{float:right;font:600 8.5px ui-monospace,monospace;color:#5b6167;background:#f2f3f6;border-radius:99px;padding:1px 6px}
  .theory{margin:0 0 7px;padding-left:13px;color:#2b2f33;font-size:10.5px}
  .theory li{margin:1px 0}
  .theory b{color:#0d0d0d}
  .real{background:#f6f8ff;border:1px solid #e3e9ff;border-radius:6px;padding:6px 8px;font-size:10px;color:#2a3550;margin-bottom:8px}
  .real .tag{display:inline-block;font:700 8px ui-monospace,monospace;color:#4d6bfe;background:#fff;border:1px solid #dde4ff;border-radius:3px;padding:1px 4px;margin-right:4px;vertical-align:1px}

  .cv{width:100%;display:block;border:1px solid #eceef2;border-radius:6px;background:#fff}

  .ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:5px 12px;margin-top:8px}
  .ctrl{display:block;font-size:9.5px}
  .ctrl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1px;color:#5b6167;font-weight:550}
  .ctrl-head .val{font:600 9px ui-monospace,monospace;color:#4d6bfe}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:99px;background:#eceef2;outline:none;margin:4px 0;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#4d6bfe;border:2px solid #fff;box-shadow:0 1px 2px rgba(77,107,254,.45);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:9px;height:9px;border-radius:50%;background:#4d6bfe;border:2px solid #fff;cursor:pointer;
  }
  select,input[type=text],input[type=number]{
    width:100%;padding:3px 6px;border:1px solid #e0e3e8;border-radius:5px;font:inherit;font-size:10px;background:#fff;color:#0d0d0d;outline:none;
  }
  select:focus,input:focus{border-color:#4d6bfe;box-shadow:0 0 0 2px #eef1ff}

  .row{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .b{font:600 10px inherit;padding:4px 9px;border-radius:6px;border:1px solid #4d6bfe;background:#4d6bfe;color:#fff;cursor:pointer;transition:.15s}
  .b:hover{background:#3a56e0;border-color:#3a56e0}
  .b:active{transform:scale(.97)}
  .b.ghost{background:#fff;color:#4d6bfe}
  .b.ghost:hover{background:#f5f7ff}
  .b:disabled{opacity:.4;cursor:not-allowed;transform:none}

  .readout{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
  .stat{font:600 9px ui-monospace,monospace;background:#f4f5f8;border-radius:4px;padding:3px 6px;color:#3b4148}
  .stat em{font-style:normal;color:#8b9096;font-weight:500}
  .stat.hi{background:#eef1ff;color:#2a3ea8}

  .quiz{margin-top:12px;border-top:1px solid #eef0f3;padding-top:9px}
  .quiz-title{font:700 8.5px ui-monospace,monospace;color:#8b9096;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
  .q{margin-bottom:7px}
  .q-text{font-weight:600;font-size:10.5px;margin-bottom:4px}
  .opts{display:flex;flex-direction:column;gap:3px}
  .opt{
    text-align:left;font:inherit;font-size:10px;padding:4px 8px;border:1px solid #e5e5e5;background:#fff;border-radius:5px;cursor:pointer;color:#2b2f33;transition:.15s;
  }
  .opt:hover{border-color:#c9d2ff;background:#fafbff}
  .opt.good{border-color:#2f9e6b;background:#f2fbf6;color:#1f7a52;font-weight:600}
  .opt.bad{border-color:#e05555;background:#fdf3f3;animation:shake .28s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .why{font-size:9.5px;color:#1f7a52;margin-top:3px;padding-left:2px}
  .finish{margin-top:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .finish .hint{font-size:9.5px;color:#8b9096}

  .bars{display:flex;gap:12px;align-items:flex-end;height:110px;margin:8px 0 4px;padding:0 4px}
  .barcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
  .barfill{width:100%;max-width:38px;border-radius:3px 3px 0 0;transition:height .09s linear}
  .barlabel{font:600 9px ui-monospace,monospace;color:#5b6167;margin-top:3px;text-align:center}
  .barval{font:600 9px ui-monospace,monospace;color:#0d0d0d;margin-bottom:2px}

  pre.code{
    background:#0d0d0d;color:#e8eaf0;border-radius:6px;padding:8px;overflow:auto;
    font:9.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;margin:0;
  }
  .tree{font:9.5px/1.5 ui-monospace,monospace;color:#2b2f33;white-space:pre;overflow:auto}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:880px){.two{grid-template-columns:1fr}}

  .done-badge{background:#f2fbf6;border:1px solid #c8e8d8;color:#1f7a52;border-radius:4px;padding:2px 6px;font:600 9px ui-monospace,monospace}
  .err-card{background:#fdf3f3;border:1px solid #f5c6c6;border-radius:6px;padding:8px 10px;color:#a83131;font-size:10px}
  .err-card b{color:#7a1f1f}

  @media(max-width:720px){
    body{flex-direction:column}
    .sidebar{
      position:static;
      width:100%;flex:0 0 auto;
      height:auto;min-height:0;
      border-right:none;border-bottom:1px solid #e5e5e5;
    }
    .sidebar-head{padding:7px 9px 5px}
    .sidebar-list{
      flex:0 0 auto;
      display:flex;flex-direction:row;
      gap:2px;
      overflow-x:auto;overflow-y:hidden;
      padding:4px 6px;
      min-height:0;
    }
    .sidebar-item{
      flex:0 0 auto;
      width:auto;
      padding:4px 7px;
      margin-bottom:0;
    }
    .sidebar-item .label{max-width:80px}
    .sidebar-item .check{display:none}
    .sidebar-foot{flex-direction:row;align-items:center;padding:5px 9px 7px;gap:8px}
    .sidebar-progress{flex:1}
    .link{margin-left:auto}
    main{padding:8px 8px 24px}
    .card{padding:8px 8px 9px}
    h2{font-size:13px}
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-head">
    <div class="brand"><span class="dot"></span>Playground Physique</div>
    <div class="brand-sub">12 sprints · 20 min</div>
  </div>
  <nav class="sidebar-list" id="rail"></nav>
  <div class="sidebar-foot">
    <div class="sidebar-progress">
      <div class="prog"><div class="prog-fill" id="progFill"></div></div>
      <div class="prog-label" id="progLabel">0 / 12</div>
    </div>
    <button id="resetAll" class="link">Réinitialiser</button>
  </div>
</aside>

<main id="stage"></main>

<script>
window.addEventListener('error', e => {
  console.error('[playground] uncaught:', e.error || e.message);
});

const el = (t,c,h) => { const e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e; };
const stage = document.getElementById('stage');
const rail  = document.getElementById('rail');
const progFill = document.getElementById('progFill');
const progLabel = document.getElementById('progLabel');

const C = { blue:'#4d6bfe', ink:'#0d0d0d', grey:'#9aa0a6', light:'#d1d5db', orange:'#e8833a', green:'#2f9e6b', red:'#e05555' };

function mkCanvas(host, h=250){
  const c = document.createElement('canvas');
  c.className = 'cv';
  c.style.height = h + 'px';
  host.appendChild(c);
  const ctx = c.getContext('2d');
  function fit(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = c.clientWidth || 600;
    c.width  = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  fit();
  const ro = new ResizeObserver(fit); ro.observe(c);
  return { c, ctx, fit, H:h, stop(){ ro.disconnect(); } };
}

function loop(fn){
  let alive = true, raf = 0, last = performance.now();
  function tick(now){
    if(!alive) return;
    const dt = Math.min(0.05, (now-last)/1000); last = now;
    try{ fn(dt); }catch(e){ console.error('[playground] frame error:', e); }
    raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);
  return () => { alive = false; cancelAnimationFrame(raf); };
}

function btn(parent, label, cls=''){
  const b = el('button','b '+cls, label);
  parent.appendChild(b);
  return b;
}

function makeSlider(parent, o){
  const wrap = el('label','ctrl');
  const head = el('div','ctrl-head');
  const fmt = o.fmt || (v => String(v));
  const out = el('span','val', fmt(o.value) + (o.unit||''));
  head.append(el('span',null,o.label), out);
  wrap.appendChild(head);
  const inp = el('input'); inp.type='range';
  inp.min=o.min; inp.max=o.max; inp.step=o.step; inp.value=o.value;
  wrap.appendChild(inp);
  parent.appendChild(wrap);
  const fns = [];
  inp.addEventListener('input', ()=>{
    out.textContent = fmt(+inp.value) + (o.unit||'');
    fns.forEach(f => f(+inp.value));
  });
  return {
    get value(){ return +inp.value; },
    on(f){ fns.push(f); return this; },
    set(v){ inp.value = v; out.textContent = fmt(+inp.value)+(o.unit||''); }
  };
}

function makeSelect(parent, o){
  const wrap = el('label','ctrl');
  wrap.appendChild(el('div','ctrl-head','<span>'+o.label+'</span>'));
  const s = el('select');
  o.options.forEach(([v,l])=>{ const op=el('option',null,l); op.value=v; s.appendChild(op); });
  s.value = o.value;
  wrap.appendChild(s);
  parent.appendChild(wrap);
  const fns = [];
  s.addEventListener('change', ()=> fns.forEach(f => f(s.value)));
  return { get value(){ return s.value; }, on(f){ fns.push(f); return this; } };
}

function arrow(ctx,x1,y1,x2,y2,color,label){
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy);
  if(len < 2) return;
  ctx.save();
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=1.8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const a = Math.atan2(dy,dx), s = 5.5;
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2 - s*Math.cos(a-0.42), y2 - s*Math.sin(a-0.42));
  ctx.lineTo(x2 - s*Math.cos(a+0.42), y2 - s*Math.sin(a+0.42));
  ctx.closePath(); ctx.fill();
  if(label){
    ctx.font='600 9px ui-monospace,monospace';
    ctx.fillText(label, x2 + 5, y2 - 5);
  }
  ctx.restore();
}

function dot(ctx,x,y,r,color){
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle = color; ctx.fill();
}

function txt(ctx,s,x,y,color='#5b6167',font='600 9.5px ui-monospace,monospace'){
  ctx.save(); ctx.fillStyle=color; ctx.font=font; ctx.textBaseline='top';
  ctx.fillText(s,x,y); ctx.restore();
}

/* ============================================================
   SPRINTS
   ============================================================ */
const SPRINTS = [];

/* ---------- 1 ---------- */
SPRINTS.push({
  short:'Position & vitesse',
  tag:'Module 1 · Cinématique',
  title:'Position, vitesse, accélération',
  theory:[
    'La <b>position</b> r(t) = (x, y, z) localise l\'objet dans l\'espace.',
    'La <b>vitesse</b> v = dr/dt : la pente de la position.',
    'L\'<b>accélération</b> a = dv/dt : la pente de la vitesse.'
  ],
  real:'Ta voiture. Le GPS donne la <b>position</b>, le compteur la <b>vitesse</b>, et ton dos collé au siège quand tu écrases la pédale, c\'est l\'<b>accélération</b>.',
  quiz:[
    { q:"Vitesse constante (a = 0) : que fait la position ?",
      opts:["Elle ne bouge pas","Elle varie linéairement","Elle accélère"], a:1,
      why:"x(t) = x₀ + v·t : c'est une droite. Vitesse constante ⇒ position qui varie à rythme constant." },
    { q:"L'accélération, c'est…",
      opts:["La dérivée de la vitesse","L'intégrale de la vitesse","La même chose que la vitesse"], a:0,
      why:"a = dv/dt. Elle mesure comment la vitesse change, pas la vitesse elle-même." }
  ],
  mount(host){
    const {c, ctx, stop} = mkCanvas(host, 165);
    const bar = el('div','ctrls'); host.appendChild(bar);
    let v0 = 12, a = 0, t = 0, run = true;

    const sv = makeSlider(bar,{label:'Vitesse initiale v₀', min:-25, max:25, step:1, value:v0, unit:' m/s', fmt:v=>v.toFixed(0)});
    const sa = makeSlider(bar,{label:'Accélération a', min:-8, max:8, step:0.5, value:a, unit:' m/s²', fmt:v=>v.toFixed(1)});
    const row = el('div','row'); bar.appendChild(row);
    const bPlay = btn(row,'⏸ Pause','ghost');
    const bReset = btn(row,'↺ Reset','ghost');

    sv.on(v=>{ v0=v; t=0; });
    sa.on(v=>{ a=v; t=0; });
    bPlay.onclick = ()=>{ run=!run; bPlay.textContent = run?'⏸ Pause':'▶ Reprendre'; };
    bReset.onclick = ()=>{ t=0; run=true; bPlay.textContent='⏸ Pause'; };

    const stopLoop = loop(dt=>{
      if(run) t += dt;
      const x = v0*t + 0.5*a*t*t;
      const v = v0 + a*t;
      if(Math.abs(x) > 22) { t = 0; }

      const w = c.clientWidth, h = c.clientHeight;
      ctx.clearRect(0,0,w,h);
      const pxm = w / 46;
      const cx = w/2, gy = h*0.68;

      ctx.strokeStyle='#eceef2'; ctx.lineWidth=1;
      for(let m=-20; m<=20; m+=5){
        const px = cx + m*pxm;
        ctx.beginPath(); ctx.moveTo(px, gy-3); ctx.lineTo(px, gy+3); ctx.stroke();
        txt(ctx, m+' m', px-11, gy+6, '#c3c8ce', '600 8.5px ui-monospace,monospace');
      }
      ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.strokeStyle='#e5e5e5'; ctx.stroke();

      const px = cx + x*pxm;
      dot(ctx, px, gy, 7, C.blue);

      const vLen = Math.max(-120, Math.min(120, v*4));
      arrow(ctx, px, gy, px+vLen, gy, C.blue, 'v');

      const aLen = Math.max(-90, Math.min(90, a*12));
      if(Math.abs(aLen) > 3) arrow(ctx, px, gy-26, px+aLen, gy-26, C.orange, 'a');

      txt(ctx, `t = ${t.toFixed(2)} s`, 8, 6, '#8b9096');
      txt(ctx, `x = ${x.toFixed(2)} m`, 8, 20, C.ink);
      txt(ctx, `v = ${v.toFixed(2)} m/s`, 8, 34, C.blue);
      txt(ctx, `a = ${a.toFixed(1)} m/s²`, 8, 48, C.orange);
    });

    return ()=>{ stopLoop(); stop(); };
  }
});

/* ---------- 2 ---------- */
SPRINTS.push({
  short:'Balistique',
  tag:'Module 1 · Cinématique',
  title:'Balistique & mouvement parabolique',
  theory:[
    'Sur l\'axe horizontal : <b>vitesse constante</b> → x(t) = x₀ + v₀ₓ·t.',
    'Sur l\'axe vertical : la gravité impose <b>a = −g</b> → z(t) = z₀ + v₀ᵣ·t − ½gt².',
    'Résultat : une <b>parabole</b>. vₓ ne change jamais, vᵣ oui.'
  ],
  real:'Un tir au basket. Le ballon avance à vitesse constante horizontalement, mais la gravité le fait retomber : parabole.',
  quiz:[
    { q:"Pendant le vol, quelle composante de vitesse reste constante ?",
      opts:["La verticale","L'horizontale","Les deux"], a:1,
      why:"Aucune force horizontale (on néglige l'air) ⇒ vₓ = constante." },
    { q:"Sur la Lune (g = 1,62 m/s²), le même tir va…",
      opts:["Beaucoup plus loin","Beaucoup moins loin","Exactement pareil"], a:0,
      why:"Portée = v₀²·sin(2θ)/g. g plus petit ⇒ portée plus grande." }
  ],
  mount(host){
    const {c, ctx, stop} = mkCanvas(host, 180);
    const bar = el('div','ctrls'); host.appendChild(bar);
    let v0 = 25, ang = 45, g = 9.81, t = 0;

    const sv = makeSlider(bar,{label:'Vitesse initiale v₀', min:5, max:45, step:1, value:v0, unit:' m/s', fmt:v=>v.toFixed(0)});
    const sa = makeSlider(bar,{label:'Angle de tir', min:10, max:85, step:1, value:ang, unit:'°', fmt:v=>v.toFixed(0)});
    const sg = makeSelect(bar,{label:'Gravité', value:'9.81', options:[
      ['1.62','Lune — 1,62 m/s²'],['3.71','Mars — 3,71 m/s²'],
      ['9.81','Terre — 9,81 m/s²'],['24.79','Jupiter — 24,79 m/s²']
    ]});
    const row = el('div','row'); bar.appendChild(row);
    const bReset = btn(row,'↺ Relancer','ghost');

    sv.on(v=>{v0=v; t=0;}); sa.on(v=>{ang=v; t=0;}); sg.on(v=>{g=+v; t=0;});
    bReset.onclick = ()=>{ t=0; };

    const stopLoop = loop(dt=>{
      const th = ang*Math.PI/180;
      const vx = v0*Math.cos(th), vz = v0*Math.sin(th);
      const T = 2*vz/g, R = vx*T, H = vz*vz/(2*g);
      t += dt;
      if(t > T) t = 0;

      const w = c.clientWidth, h = c.clientHeight;
      ctx.clearRect(0,0,w,h);

      const padL = 28, padB = 22;

      why:"U = mgz est maximale quand z est maximal, et E_c = 0 puisque v = 0 au départ." }
  ],
  mount(host){
    const {c, ctx, stop} = mkCanvas(host, 175);
    const bars = el('div','bars'); host.appendChild(bars);
    const mkBar = (label,color)=>{
      const col = el('div','barcol');
      const val = el('div','barval','0 %');
      const fill = el('div','barfill'); fill.style.background=color; fill.style.height='0%';
      const lab = el('div','barlabel',label);
      col.append(val,fill,lab); bars.appendChild(col);
      return {fill,val};
    };
    const bC = mkBar('E_c','#c9d2ff');
    const bU = mkBar('U','#c8e8d8');
    const bM = mkBar('E_m',C.blue);

    const bar = el('div','ctrls'); host.appendChild(bar);
    const g = 9.81, m = 1;
    let h0 = 8, e = 0.75;
    let z = h0, vz = 0, lost = 0, bounces = 0, restTimer = 0;

    const sh = makeSlider(bar,{label:'Hauteur de départ', min:2, max:12, step:0.5, value:h0, unit:' m', fmt:x=>x.toFixed(1)});
    const se = makeSlider(bar,{label:'Coefficient de rebond e', min:0.2, max:1, step:0.05, value:e, fmt:x=>x.toFixed(2)});
    const row = el('div','row'); bar.appendChild(row);
    const bR = btn(row,'↺ Relancer','ghost');
    sh.on(x=>{ h0=x; reset(); }); se.on(x=>{ e=x; reset(); });
    bR.onclick = reset;
    function reset(){ z=h0; vz=0; lost=0; bounces=0; restTimer=0; }

    const E0 = () => m*g*h0;

    const stopLoop = loop(dt=>{
      const w = c.clientWidth, h = c.clientHeight;
      vz -= g*dt;
      z += vz*dt;
      if(z < 0){
        const impact = Math.abs(vz);
        lost += 0.5*m*impact*impact*(1-e*e);
        z = 0;
        vz = -vz*e;
        bounces++;
        if(Math.abs(vz) < 0.8){ vz = 0; }
      }
      if(z <= 0.001 && Math.abs(vz) < 0.01){
        restTimer += dt;
        if(restTimer > 1.4) reset();
      }

      const Ec = 0.5*m*vz*vz;
      const U  = m*g*Math.max(z,0);
      const Em = Ec + U;
      const den = Math.max(E0(), 0.001);

      bC.fill.style.height = Math.min(100, Ec/den*100)+'%';
      bU.fill.style.height = Math.min(100, U/den*100)+'%';
      bM.fill.style.height = Math.min(100, Em/den*100)+'%';
      bC.val.textContent = Ec.toFixed(1)+' J';
      bU.val.textContent = U.toFixed(1)+' J';
      bM.val.textContent = Em.toFixed(1)+' J';

      ctx.clearRect(0,0,w,h);
      const ground = h-18;
      const pxm = (h-32)/12;
      const X = w*0.5;

      ctx.strokeStyle='#e5e5e5'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(14,ground); ctx.lineTo(w-14,ground); ctx.stroke();

      ctx.setLineDash([3,3]);
      ctx.strokeStyle='#eef1ff';
      ctx.beginPath(); ctx.moveTo(14, ground-h0*pxm); ctx.lineTo(w-14, ground-h0*pxm); ctx.stroke();
      ctx.setLineDash([]);

      const Y = ground - z*pxm;
      dot(ctx, X, Y, 8, C.blue);

      arrow(ctx, X+12, Y, X+12, Y + vz*3, vz>0?C.green:C.orange, 'v');

      txt(ctx, `z = ${Math.max(z,0).toFixed(2)} m`, 6, 6, C.ink);
      txt(ctx, `chocs : ${bounces} · énergie perdue : ${lost.toFixed(1)} J`, 6, 20, '#8b9096');
    });

    return ()=>{ stopLoop(); stop(); };
  }
});

      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(cx-bx, cy-by); ctx.lineTo(cx+bx, cy-by);
      ctx.lineTo(cx+bx, cy+by); ctx.lineTo(cx-bx, cy+by); ctx.closePath();
      ctx.stroke();
      if(progress >= 2){
        ctx.beginPath();
        ctx.moveTo(cx-bx, cy-by); ctx.lineTo(cx-bx+skew, cy-by-skew*0.6);
        ctx.lineTo(cx+bx+skew, cy-by-skew*0.6); ctx.lineTo(cx+bx, cy-by);
        ctx.stroke();
      }

      if(progress >= 3){
        const t = performance.now()/1000;
        parts.forEach(p=>{
          const moved = progress >= 5;
          const px = moved ? (p.x + Math.sin(t*0.6 + p.ph)*0.06) : p.x;
          const py = moved ? (p.y + Math.cos(t*0.5 + p.ph)*0.06) : p.y;
          const X = cx - bx + px*2*bx;
          const Y = cy - by + py*2*by;
          const R = progress >= 4 ? p.r*2.6 : 2;
          ctx.beginPath(); ctx.arc(X, Y, R, 0, Math.PI*2);
          if(progress >= 4){
            const k = Math.min(1, p.r/1.6);
            ctx.fillStyle = `rgba(${77 + 60*k}, ${107 + 40*k}, 254, ${0.35 + 0.5*k})`;
          } else {
            ctx.fillStyle = 'rgba(150,158,170,.75)';
          }
          ctx.fill();
        });
      }

      if(progress >= 5){
        txt(ctx,'▶ animation en cours', 6, 6, C.blue);
      }
      txt(ctx,`pipeline : ${progress}/5`, 6, h-14, '#8b9096');
    });

    return ()=>{ stopLoop(); stop(); };
  }
});

/* ============================================================
   STATE
   ============================================================ */
const KEY = 'playground_physique_v2';
let state = { done: [] };
try{
  const raw = localStorage.getItem(KEY) || localStorage.getItem('playground_physique_v1');
  if(raw){
    const p = JSON.parse(raw);
    if(p && Array.isArray(p.done)) state = { done: p.done.filter(x => Number.isInteger(x) && x >= 0 && x < SPRINTS.length) };
  }
}catch(e){ console.warn('[playground] state parse failed', e); }

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
const isUnlocked = i => i === 0 || state.done.includes(i-1);

let current = 0;
let cleanup = null;

function renderRail(){
  rail.innerHTML = '';
  SPRINTS.forEach((s,i)=>{
    const b = el('button','sidebar-item');
    const done = state.done.includes(i);
    const locked = !isUnlocked(i);
    b.innerHTML =
      `<span class="num">${String(i+1).padStart(2,'0')}</span>` +
      `<span class="label">${s.short}</span>` +
      `<span class="check">✓</span>`;
    if(done) b.classList.add('done');
    if(i === current) b.classList.add('active');
    if(locked) b.classList.add('locked');
    b.onclick = ()=>{ if(isUnlocked(i)) open(i); };
    rail.appendChild(b);
  });
  const p = SPRINTS.length ? (state.done.length / SPRINTS.length * 100) : 0;
  progFill.style.width = p + '%';
  progLabel.textContent = `${state.done.length} / ${SPRINTS.length}`;
}

function renderBilan(){
  current = SPRINTS.length;
  stage.innerHTML = '';
  const card = el('div','card');
  card.innerHTML = `
    <div class="eyebrow">Parcours terminé<span class="pill">12 / 12</span></div>
    <h2>🎉 Les 12 sprints sont validés</h2>
    <ul class="theory">
      <li>Cinématique : position, vitesse, accélération, balistique, MCU.</li>
      <li>Dynamique : 3 lois de Newton, différences finies, réflexion aux bords.</li>
      <li>Énergie : travail, énergie mécanique, collisions élastiques.</li>
      <li>Logiciel : classes Python, export HDF5/XDMF, ParaView.</li>
    </ul>
    <div class="real"><span class="tag">prochaine étape</span>Ouvre ton vrai projet Python et écris la classe <b>Atome</b> avec <code>np.array</code> pour position et vitesse.</div>`;
  stage.appendChild(card);
  renderRail();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function open(i){
  if(i === SPRINTS.length){
    if(cleanup){ try{ cleanup(); }catch(e){} cleanup = null; }
    renderBilan();
    return;
  }
  if(!SPRINTS[i]) return;

  if(cleanup){ try{ cleanup(); }catch(e){} cleanup = null; }
  current = i;
  const s = SPRINTS[i];
  stage.innerHTML = '';

  const card = el('div','card');
  const eyebrow = el('div','eyebrow', s.tag);
  eyebrow.innerHTML += `<span class="pill">20 min</span>`;
  card.appendChild(eyebrow);
  card.appendChild(el('h2', null, s.title));

  const theory = el('ul','theory');
  s.theory.forEach(t => theory.appendChild(el('li', null, t)));
  card.appendChild(theory);

  card.appendChild(el('div','real', `<span class="tag">Monde réel</span>${s.real}`));

  const play = el('div','play');
  card.appendChild(play);

  const qz = el('div','quiz');
  qz.appendChild(el('div','quiz-title','Vérifie que c\'est ancré'));
  const answered = new Array(s.quiz.length).fill(false);

  const finishRow = el('div','finish');
  const finishBtn = el('button','b','Terminer le sprint ✓');
  finishBtn.disabled = true;
  const hint = el('div','hint','Réponds juste aux questions pour valider.');

  s.quiz.forEach((q, qi)=>{
    const box = el('div','q');
    box.appendChild(el('div','q-text', `${qi+1}. ${q.q}`));
    const opts = el('div','opts');
    q.opts.forEach((o, oi)=>{
      const b = el('button','opt', o);
      b.onclick = ()=>{
        if(box.classList.contains('ok')) return;
        if(oi === q.a){
          b.classList.add('good');
          box.classList.add('ok');
          box.appendChild(el('div','why', '✓ ' + q.why));
          answered[qi] = true;
          if(answered.every(Boolean)){
            finishBtn.disabled = false;
            hint.textContent = 'Tout est bon — valide le sprint.';
          }
        } else {
          b.classList.add('bad');
          setTimeout(()=>b.classList.remove('bad'), 380);
        }
      };
      opts.appendChild(b);
    });
    box.appendChild(opts);
    qz.appendChild(box);
  });

  finishBtn.onclick = ()=>{
    if(!state.done.includes(i)) state.done.push(i);
    save();
    finishBtn.textContent = '✓ Sprint validé';
    finishBtn.disabled = true;
    hint.innerHTML = '<span class="done-badge">+1 sprint</span> Prochain débloqué…';
    renderRail();
    setTimeout(()=>{
      if(i+1 < SPRINTS.length) open(i+1);
      else open(SPRINTS.length);
    }, 800);
  };

  finishRow.append(finishBtn, hint);
  qz.appendChild(finishRow);
  card.appendChild(qz);
  stage.appendChild(card);

  try {
    cleanup = s.mount(play) || null;
  } catch(e){
    console.error('[playground] mount failed for sprint', i+1, e);
    const errBox = el('div','err-card');
    errBox.innerHTML = `<b>Ce playground n'a pas pu s'initialiser.</b><br>Le reste fonctionne : tu peux répondre au quiz et valider. Détail en console : <code>${(e && e.message) || e}</code>`;
    play.appendChild(errBox);
    cleanup = null;
  }

  renderRail();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('resetAll').onclick = ()=>{
  if(!confirm('Effacer toute la progression ?')) return;
  state = { done: [] };
  save();
  open(0);
};

renderRail();
let startAt = 0;
for(let i=0;i<SPRINTS.length;i++){ if(!state.done.includes(i)){ startAt = i; break; } }
if(state.done.length >= SPRINTS.length) startAt = SPRINTS.length;
open(startAt);
</script>
