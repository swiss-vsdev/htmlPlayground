:root{--bg:#f4f6ff;--card:#fff;--text:#14142b;--muted:#6b7280;--line:#e6e8ee;--accent:#5b6cff;--accent-soft:#eef0ff;--good:#16a34a;--good-soft:#e8f7ee;--bad:#e11d48;--bad-soft:#fdeaee;--warn:#f59e0b;--warn-soft:#fff5e5;--purple:#a855f7;--pink:#ec4899;--shadow:0 2px 4px rgba(16,24,40,.04),0 10px 28px rgba(60,60,140,.10);--safe-b:env(safe-area-inset-bottom,0px)}
[data-theme=dark]{--bg:#0e0f1a;--card:#171a28;--text:#f2f3f7;--muted:#9aa1b1;--line:#262a3c;--accent:#8a97ff;--accent-soft:#1d2142;--good:#34d399;--good-soft:#10261d;--bad:#fb7185;--bad-soft:#2a1219;--warn:#fbbf24;--warn-soft:#2a2110;--purple:#c084fc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 500px at 50% -10%,var(--accent-soft),transparent),var(--bg);color:var(--text);min-height:100dvh;padding-bottom:calc(92px + var(--safe-b));touch-action:manipulation;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:transform .12s}
button:active{transform:scale(.96)}
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hbar{max-width:780px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--pink));display:grid;place-items:center;font-size:19px;box-shadow:0 4px 12px rgba(91,108,255,.4)}
.spacer{flex:1}
.chip{display:inline-flex;gap:4px;background:var(--card);border:1px solid var(--line);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;box-shadow:var(--shadow)}
.xp{color:var(--accent)}.fire{color:#f97316}
.iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);font-size:16px}
main{max-width:780px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,var(--accent),var(--purple) 60%,var(--pink));color:#fff;border:none}
.hero .muted{color:rgba(255,255,255,.85)}.hero .bar{background:rgba(255,255,255,.3)}.hero .bar>i{background:#fff}
h2{margin:4px 0 10px;font-size:21px}h3{margin:0 0 8px;font-size:15px}
.muted{color:var(--muted);font-size:13px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.btn{display:block;width:100%;padding:13px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:15px;text-align:left;box-shadow:var(--shadow)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;border-color:transparent;text-align:center}
.btn.ch{background:linear-gradient(135deg,#e11d48,#f43f5e);color:#fff;border-color:transparent;text-align:center}
.btn.ch small{color:rgba(255,255,255,.9)}
.btn.huge{padding:20px 14px;font-size:19px;border-radius:20px;animation:pulse 2.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(91,108,255,.18)}}
.btn small{display:block;font-weight:600;color:var(--muted);font-size:12px;margin-top:2px}
.btn.pri small{color:rgba(255,255,255,.85)}
.btn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good);animation:bump .3s}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);animation:shake .35s}
.kbd{display:inline-block;min-width:22px;padding:1px 6px;margin-right:8px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-size:12px;text-align:center}
@keyframes bump{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bar{height:11px;border-radius:99px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--pink));transition:width .35s}
.big{font-size:84px;text-align:center;line-height:1.1;margin-top:6px;animation:bounce .5s}
@keyframes bounce{0%{transform:scale(.3)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.q{font-size:30px;font-weight:900;text-align:center;margin:8px 0 4px;word-break:break-word}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px}
.tagrow{text-align:center;margin-bottom:4px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin:0 2px}
.tag.new{background:var(--warn-soft);color:var(--warn)}
.tag.ch{background:var(--bad-soft);color:var(--bad)}
input.t{width:100%;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--text);font-size:19px;text-align:center;outline:none}
input.t:focus{border-color:var(--accent)}
.fb{padding:12px;border-radius:14px;margin:10px 0;font-weight:700;font-size:14px}

.row{display:flex;align-items:center;gap:8px}

.lrow .e{font-size:24px;width:32px;text-align:center}.lrow .m{flex:1}.lrow span.en{color:var(--muted);text-align:right}
.flash{min-height:230px;display:grid;place-items:center;text-align:center;font-size:30px;font-weight:900;padding:20px;cursor:pointer}
.flash .e{font-size:72px;display:block}
.stat{background:var(--accent-soft);border-radius:16px;padding:12px 8px;text-align:center}

.week{display:flex;align-items:flex-end;gap:6px;height:90px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--muted);font-weight:700}

.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px;font-size:12px;color:var(--muted);font-weight:700}
.dots{display:flex;gap:5px;justify-content:center;margin:6px 0}

.navin{max-width:780px;margin:0 auto;display:flex}

.nbtn .ic{font-size:21px}.nbtn.on{color:var(--accent)}.nbtn.on .ic{transform:scale(1.2)}
.search{width:100%;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--text);font-size:15px;margin-bottom:10px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:99px;font-weight:800;font-size:13px;z-index:99;max-width:92vw;text-align:center}
.fly{position:fixed;font-size:28px;pointer-events:none;z-index:120;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.spk{display:inline-grid;vertical-align:middle;width:40px;height:40px;margin-left:6px;font-size:18px}

 $('#go').onclick=()=>startGame(cfg.mode,cfg.scope,cfg.n)}
let lq='',lf='all';
function vList(){$('#app').innerHTML=`<input class="search" id="sq" placeholder="🔍 Chercher (FR ou EN)…" value="${esc(lq)}"><div class="grid g2" style="margin-bottom:10px;grid-template-columns:repeat(4,1fr)">${[['all','📚 Tous'],['ch','🇨🇭 Suisse'],['ko','❗ Erreurs'],['ok','🏅 Acquis']].map(f=>`<button class="btn ${lf===f[0]?'on':''}" data-f="${f[0]}" style="text-align:center;padding:12px 4px;font-size:13px">${f[1]}</button>`).join('')}</div><div class="card" id="lst"></div>`;
 const paint=()=>{const q=nfLoose(lq);let r=W.filter(w=>!q||nfLoose(w.fr).includes(q)||nfLoose(w.en).includes(q)||(w.alt&&nfLoose(w.alt).includes(q)));
  if(lf==='ko')r=r.filter(w=>(S.cards[w.id]||{}).ko>0);if(lf==='ok')r=r.filter(w=>bOf(w)>=4);if(lf==='ch')r=r.filter(w=>w.ch);
  $('#lst').innerHTML=`<div class="muted">${r.length} mots · touche un mot pour l'écouter 🔊</div>`+r.slice(0,200).map(w=>`<div class="lrow" data-w="${esc(w.fr)}"><span class="e">${w.em}</span><div class="m"><b>${flag(w)}${esc(w.fr)}</b>${w.alt?`<div class="muted">🇫🇷 ${esc(w.alt.split('|').join(' / '))}</div>`:''}</div><span class="en">${esc(w.en)}</span><span>🔊</span></div>`).join('')+(r.length>200?'<p class="muted">Affine la recherche…</p>':'');
  $('#lst').querySelectorAll('[data-w]').forEach(e=>e.onclick=()=>speak(e.dataset.w))};
 paint();$('#sq').oninput=e=>{lq=e.target.value;paint()};document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{lf=b.dataset.f;vList()})}
function vStats(){const acc=S.tot?Math.round(S.ok/S.tot*100):0;
 const hard=W.filter(w=>(S.cards[w.id]||{}).ko>0).sort((a,b)=>S.cards[b.id].ko-S.cards[a.id].ko).slice(0,15);
 $('#app').innerHTML=`<div class="card"><div class="grid g3"><div class="stat"><b>${acc}%</b><span>🎯 justesse</span></div><div class="stat"><b>${S.tot}</b><span>💬 réponses</span></div><div class="stat"><b>${S.games}</b><span>🎮 sessions</span></div></div></div><div class="card"><h3>😵 Mots les plus ratés</h3>${hard.length?hard.map(w=>`<div class="lrow"><span class="e">${w.em}</span><b class="m">${flag(w)}${esc(w.fr)}</b><span class="en">${esc(w.en)} · ✗${S.cards[w.id].ko}</span></div>`).join(''):'<p class="muted">Rien pour l\'instant 🎉</p>'}</div><div class="card"><h3>⚙️ Réglages</h3><div class="grid"><button class="btn" id="vo">🗣️ Lecture automatique des mots : ${S.voice?'OUI':'NON'}<small>Le bouton 🔊 reste toujours disponible</small></button><button class="btn" id="np">🆕 Nouveaux mots par session : ${S.newPer}</button><button class="btn" id="aut">⏩ Avance auto après bonne réponse : ${S.auto?'OUI':'NON'}</button><button class="btn" id="art">📝 Article obligatoire (EN→FR) : ${S.needArt?'OUI':'NON'}</button><button class="btn" id="snd">${S.sound?'🔊':'🔇'} Sons d'effets : ${S.sound?'OUI':'NON'}</button><button class="btn" id="exp">⬇️ Exporter la progression</button><button class="btn" id="imp">⬆️ Importer</button><button class="btn bad" id="rst">🗑️ Réinitialiser</button></div><input type="file" id="file" accept=".json" style="display:none"></div>`;
 $('#vo').onclick=()=>{S.voice=!S.voice;save();vStats()};
 $('#np').onclick=()=>{S.newPer=S.newPer>=15?3:S.newPer+(S.newPer<5?2:5);save();vStats()};
 $('#aut').onclick=()=>{S.auto=!S.auto;save();vStats()};
 $('#art').onclick=()=>{S.needArt=!S.needArt;save();vStats()};$('#snd').onclick=()=>{S.sound=!S.sound;save();vStats()};
 $('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='mots-fr-progression.json';a.click()};
 $('#imp').onclick=()=>$('#file').click();
 $('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(defState(),JSON.parse(r.result));save();toast('Importé ✅');render()}catch(x){toast('Fichier invalide ❌')}};r.readAsText(f)};
 $('#rst').onclick=()=>{if(confirm('Tout effacer ?')){S=defState();save();render()}}}
document.querySelectorAll('.nbtn').forEach(b=>b.onclick=()=>go(b.dataset.nav));
function applyTheme(){document.documentElement.dataset.theme=S.theme;$('#themeBtn').textContent=S.theme==='dark'?'☀️':'🌙'}
$('#themeBtn').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';save();applyTheme()};
$('#brandN').textContent=W.length+' Mots';
(function icon(){try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#5b6cff');g.addColorStop(.6,'#a855f7');g.addColorStop(1,'#ec4899');x.fillStyle=g;x.fillRect(0,0,180,180);x.font='110px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🇨🇭',90,98);const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l)}catch(e){}})();
applyTheme();touchDay();save();render();
</script></body></html>
