<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#4d6bfe">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>215 Verbes Français — Cours & Jeu</title>
<style>
:root{
  --bg:#f6f7fb;--card:#fff;--text:#0d0d12;--muted:#6b7280;
  --line:#e6e8ee;--accent:#4d6bfe;--accent-soft:#eef1ff;
  --good:#16a34a;--good-soft:#e8f7ee;--bad:#e11d48;--bad-soft:#fdeaee;
  --warn:#f59e0b;--warn-soft:#fff5e5;--purple:#8b5cf6;--purple-soft:#f3efff;
  --pink:#ec4899;--gold:#fbbf24;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
  --shadow-lg:0 2px 4px rgba(16,24,40,.04),0 18px 40px rgba(16,24,40,.10);
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#0e0f14;--card:#171922;--text:#f2f3f7;--muted:#9aa1b1;
  --line:#262a36;--accent:#7b91ff;--accent-soft:#1c2140;
  --good:#34d399;--good-soft:#10261d;--bad:#fb7185;--bad-soft:#2a1219;
  --warn:#fbbf24;--warn-soft:#2a2110;--purple:#a78bfa;--purple-soft:#1e1a33;
  --pink:#f472b6;--gold:#fcd34d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);min-height:100dvh;
  padding-bottom:calc(92px + var(--safe-b));
  transition:background .25s,color .25s;-webkit-font-smoothing:antialiased;
  touch-action:manipulation;overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation}
input,textarea{font-family:inherit;user-select:text;-webkit-user-select:text}

header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
.hbar{max-width:780px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px;letter-spacing:-.3px}
.brand .dot{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--purple));display:grid;place-items:center;color:#fff;font-size:13px;font-weight:900;box-shadow:0 4px 12px rgba(77,107,254,.35)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.chip.xp{color:var(--accent)}.chip.fire{color:#f97316}
.iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);font-size:16px;transition:transform .12s}
.iconbtn:active{transform:scale(.9)}

main{max-width:780px;margin:0 auto;padding:14px 14px 0}
.view{animation:fade .3s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:13px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.5px}
h2{font-size:15px;margin:0 0 10px;font-weight:800;letter-spacing:-.1px}
h3{font-size:13.5px;margin:14px 0 6px;font-weight:800}
.sub{color:var(--muted);font-size:13px;margin:0;line-height:1.5}
.muted{color:var(--muted)}.center{text-align:center}

/* HERO */
.hero{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:13px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top right,color-mix(in srgb,var(--accent) 12%,transparent),transparent 60%);pointer-events:none}
.ring{position:relative;width:100px;height:100px;flex:0 0 auto;z-index:1}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:900;letter-spacing:-.8px}
.ring .val small{display:block;font-size:9px;font-weight:700;color:var(--muted);letter-spacing:0}
.hero-txt{flex:1;min-width:0;z-index:1}
.hero-txt h1{margin-bottom:4px;font-size:20px}
.statrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.stat{background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:5px 9px;font-size:11.5px;font-weight:800}
.stat.g{background:var(--good-soft);color:var(--good)}.stat.w{background:var(--warn-soft);color:var(--warn)}
.stat.b{background:var(--bad-soft);color:var(--bad)}.stat.p{background:var(--purple-soft);color:var(--purple)}

/* BUTTONS */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px;border-radius:15px;min-height:54px;background:var(--accent);color:#fff;font-weight:800;font-size:15px;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 32%,transparent);transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow)}
.btn.soft{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn.good{background:var(--good);box-shadow:0 8px 20px color-mix(in srgb,var(--good) 30%,transparent)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:11px 14px;font-size:13px;border-radius:12px;min-height:auto}
.btn[disabled]{opacity:.5;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.modecard{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:15px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .12s,border-color .15s;min-height:74px}
.modecard:active{transform:scale(.97);border-color:var(--accent)}
.modecard .em{width:44px;height:44px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;font-size:21px;background:var(--accent-soft)}
.modecard .t{font-weight:800;font-size:14.5px;display:block}
.modecard .d{font-size:11.5px;color:var(--muted);margin-top:2px;display:block}

/* PROGRESS */
.mastery{display:flex;flex-direction:column;gap:9px}
.mrow{display:flex;align-items:center;gap:10px;font-size:12.5px}
.mrow .lbl{width:100px;flex:0 0 auto;color:var(--muted);font-weight:700}
.mbar{flex:1;height:9px;border-radius:999px;background:var(--line);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.mrow .n{width:38px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}

/* GAME TOP */
.game-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pbar{flex:1;height:10px;border-radius:999px;background:var(--line);overflow:hidden;position:relative}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--purple));border-radius:999px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.xp-track{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:12px;font-size:12px;font-weight:800}
.xp-track .xpn{margin-left:auto;color:var(--accent);font-size:14px}

.combo-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:900;font-size:13px;background:linear-gradient(135deg,var(--warn),var(--pink));color:#fff;box-shadow:0 6px 18px rgba(245,158,11,.35);animation:comboPulse 1.2s ease-in-out infinite}
@keyframes comboPulse{50%{transform:scale(1.06)}}
.timer-badge{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;font-weight:900;font-size:13px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.timer-badge.danger{background:var(--bad-soft);color:var(--bad);animation:comboPulse .6s infinite}
.lives-badge{display:inline-flex;align-items:center;gap:4px;font-size:15px}

/* QUESTION CARD */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);padding:22px 20px;margin-bottom:14px;text-align:center;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.qcard .q-label{font-size:10.5px;font-weight:900;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.qcard .q-word{font-size:28px;font-weight:900;letter-spacing:-.7px;line-height:1.2;word-break:break-word;max-width:100%}
.qcard .q-word.small{font-size:19px;font-weight:700;letter-spacing:-.2px}
.qcard .q-sub{margin-top:10px;font-size:13px;color:var(--muted);font-weight:700}
.qcard .q-verb{margin-top:6px;font-size:15px;color:var(--accent);font-weight:800;font-style:italic}

/* FLASHCARD */
.flashcard{perspective:1400px;height:290px;margin-bottom:14px;touch-action:none;user-select:none;-webkit-user-select:none}
.fc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-drag{position:absolute;inset:0;transition:transform .3s cubic-bezier(.2,.8,.2,1);will-change:transform}
.fc-drag.dragging{transition:none}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.fc-back{transform:rotateY(180deg);background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--purple) 15%,var(--accent-soft)));border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.fc-label{font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.fc-word{font-size:36px;font-weight:900;letter-spacing:-1.4px;line-height:1.1;word-break:break-word}
.fc-back .fc-word{font-size:26px;color:var(--accent);font-weight:800}
.fc-example{margin-top:14px;font-size:12.5px;font-style:italic;line-height:1.5;color:var(--text);opacity:.85;max-width:94%}
.fc-example .en{display:block;font-size:11px;color:var(--muted);font-style:normal;margin-top:3px}
.fc-hint{margin-top:12px;font-size:11px;color:var(--muted)}
.speaker{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:17px;z-index:3}
.confbtn{position:absolute;top:12px;left:12px;width:40px;height:40px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;z-index:3}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.opt{padding:15px 16px;border-radius:15px;text-align:left;font-size:15px;font-weight:700;background:var(--card);border:1.5px solid var(--line);box-shadow:var(--shadow);transition:transform .1s,border-color .15s,background .15s;display:flex;align-items:center;gap:10px;min-height:56px}
.opt:active{transform:scale(.98)}
.opt .key{width:26px;height:26px;border-radius:8px;flex:0 0 auto;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted)}
.opt.correct{background:var(--good-soft);border-color:var(--good);color:var(--good);animation:pop .35s}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);animation:shake .4s}
@keyframes pop{40%{transform:scale(1.03)}}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.opt[disabled]{pointer-events:none;opacity:.7}
.opt.correct[disabled],.opt.wrong[disabled]{opacity:1}

.typebox{display:flex;gap:8px;margin-bottom:14px}
.typebox input{flex:1;padding:15px;border-radius:15px;font-size:16px;font-weight:600;border:1.5px solid var(--line);background:var(--card);color:var(--text);outline:none;transition:border-color .15s;min-height:56px}
.typebox input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent)}
.typebox input.ok{border-color:var(--good);background:var(--good-soft)}
.typebox input.ko{border-color:var(--bad);background:var(--bad-soft)}

.feedback{border-radius:14px;padding:13px 15px;margin-bottom:12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px;animation:fade .2s}
.feedback.ok{background:var(--good-soft);color:var(--good)}
.feedback.ko{background:var(--bad-soft);color:var(--bad)}

.rating{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate{padding:13px 6px;border-radius:14px;font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--card);transition:transform .1s;min-height:72px;justify-content:center}
.rate:active{transform:scale(.94)}
.rate .ic{font-size:18px}
.rate.r0{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.rate.r1{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.rate.r2{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.rate.r3{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}

/* BROWSE */
.searchbar{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:11px}
.searchbar input{flex:1;border:none;background:none;outline:none;font-size:15px;color:var(--text)}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.fbtn{padding:8px 13px;border-radius:999px;font-size:12px;font-weight:800;background:var(--card);border:1px solid var(--line);color:var(--muted);transition:all .15s;min-height:34px}
.fbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.vlist{display:flex;flex-direction:column;gap:8px}
.vitem{display:flex;align-items:center;gap:11px;padding:12px 13px;background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);transition:transform .1s;cursor:pointer}
.vitem:active{transform:scale(.99);border-color:var(--accent)}
.vitem .num{width:32px;height:32px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.vitem .fr{font-weight:800;font-size:15px;display:block}
.vitem .en{font-size:12.5px;color:var(--muted);margin-top:1px;display:block}
.vitem .body{flex:1;min-width:0}
.lvldot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}

/* STATS */
.bigstat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.bigstat .n{font-size:24px;font-weight:900;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.bigstat .l{font-size:10.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin-top:2px}
.bars{display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:6px}
.bars .b{flex:1;background:var(--accent-soft);border-radius:6px 6px 3px 3px;position:relative;min-height:4px;transition:height .5s}
.bars .b.has{background:linear-gradient(180deg,var(--accent),var(--purple))}
.ach-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.ach{aspect-ratio:1;border-radius:14px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center;border:2px solid var(--line);filter:grayscale(1);opacity:.45;transition:all .3s}
.ach.unlocked{filter:none;opacity:1;background:var(--card);border-color:var(--gold);box-shadow:0 4px 16px rgba(251,191,36,.25)}
.ach .em{font-size:22px;margin-bottom:2px}
.ach .nm{font-size:9px;font-weight:800;line-height:1.15;letter-spacing:-.2px}

/* LESSONS */
.lesson-card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.lesson-head{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .15s}
.lesson-head:active{background:var(--accent-soft)}
.lesson-head .licon{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.lesson-head .lt{font-weight:800;font-size:15px}
.lesson-head .ld{font-size:11.5px;color:var(--muted);margin-top:2px}
.lesson-body{padding:0 16px 16px;display:none;animation:fade .2s}
.lesson-card.open .lesson-body{display:block}
.lesson-body p{font-size:13.5px;line-height:1.6;margin:0 0 10px}
.lesson-body ul{margin:0 0 10px;padding-left:18px;font-size:13.5px;line-height:1.6}
.lesson-body li{margin-bottom:4px}
.lesson-body .ex{background:var(--bg);padding:10px 12px;border-radius:10px;border-left:3px solid var(--accent);font-size:13px;line-height:1.5;margin-bottom:8px}
.lesson-body .ex b{color:var(--accent)}
.lesson-body .tip{background:var(--warn-soft);color:var(--warn);padding:10px 12px;border-radius:10px;font-size:12.5px;font-weight:700;line-height:1.5;margin-top:8px}
.lesson-body table{width:100%;border-collapse:separate;border-spacing:0 3px;font-size:13px;margin-bottom:10px}
.lesson-body td{padding:7px 10px;background:var(--bg)}
.lesson-body td:first-child{font-weight:700;color:var(--muted);width:40%;border-top-left-radius:8px;border-bottom-left-radius:8px}
.lesson-body td:last-child{border-top-right-radius:8px;border-bottom-right-radius:8px}

/* CONJUGATION TABLE */
.conj-tabs{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.ctab{flex:1;padding:8px 6px;border-radius:10px;font-size:11.5px;font-weight:800;background:var(--bg);border:1px solid var(--line);color:var(--muted);transition:all .15s;min-height:38px;min-width:70px}
.ctab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.conj-table{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:14px}
.conj-table tr{background:var(--bg)}
.conj-table td{padding:9px 12px}
.conj-table td:first-child{font-weight:800;color:var(--muted);width:34%;border-top-left-radius:10px;border-bottom-left-radius:10px;font-size:12.5px}
.conj-table td:last-child{font-weight:700;border-top-right-radius:10px;border-bottom-right-radius:10px}
.conj-aux{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}

/* MODAL */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal-back.on{opacity:1;pointer-events:auto}
.modal{background:var(--card);width:100%;max-width:640px;border-radius:24px 24px 0 0;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 20px calc(24px + var(--safe-b));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 40px rgba(0,0,0,.25);position:relative}
.modal-back.on .modal{transform:none}
.modal-handle{width:36px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 14px}
.modal h2{margin:0 0 4px;font-size:22px;letter-spacing:-.4px;padding-right:44px}
.modal .en{color:var(--muted);font-size:14px;margin-bottom:14px}
.modal-close{position:absolute;top:14px;right:14px}

/* NAV */
nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
.navin{max-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;font-size:10px;font-weight:800;color:var(--muted);transition:color .15s,background .15s}
.nbtn .ic{font-size:19px;line-height:1}

const REFLEX_PRON = ["me","te","se","nous","vous","se"];

const SUBJ_PERS = ["je","tu","il","nous","vous","ils"];

function isReflexive(inf){ return /^se /.test(inf) || /^s'/.test(inf); }
function stripReflex(inf){ return inf.replace(/^se /,"").replace(/^s'/,""); }
function makeReflex(pron, form){
  if(form === "—") return "—";
  const needsElision = /^[aeiouéèêàâîôûh]/.test(form);
  if(needsElision){
    if(pron === "me") return "m'" + form;
    if(pron === "te") return "t'" + form;
    return pron + " " + form;
  }
  return pron + " " + form;
}

function conjPresent(inf){
  if(IRR_PRES[inf]) return IRR_PRES[inf].slice();
  if(isReflexive(inf)){
    const base = stripReflex(inf);
    return conjPresent(base).map((f,i)=> makeReflex(REFLEX_PRON[i], f));
  }
  if(inf.endsWith("er")){
    const stem = inf.slice(0,-2);
    return [stem+"e",stem+"es",stem+"e",stem+"ons",stem+"ez",stem+"ent"];
  }
  if(inf.endsWith("ir")){
    const PARTIR_TYPE = new Set(["partir","sortir","dormir","sentir"]);
    const stem = inf.slice(0,-2);
    if(PARTIR_TYPE.has(inf)) return [stem+"s",stem+"s",stem+"t",stem+"ons",stem+"ez",stem+"ent"];
    return [stem+"is",stem+"is",stem+"it",stem+"issons",stem+"issez",stem+"issent"];
  }
  if(inf.endsWith("re")){
    const stem = inf.slice(0,-2);
    return [stem+"s",stem+"s",stem,stem+"ons",stem+"ez",stem+"ent"];
  }
  return ["?","?","?","?","?","?"];
}

function pastParticiple(inf){
  if(IRR_PP[inf]) return IRR_PP[inf];
  if(isReflexive(inf)) return pastParticiple(stripReflex(inf));
  if(inf.endsWith("er")) return inf.slice(0,-2)+"é";
  if(inf.endsWith("ir")) return inf.slice(0,-2)+"i";
  if(inf.endsWith("re")) return inf.slice(0,-2)+"u";
  return "?";
}

function futureStem(inf){
  if(IRR_FUT[inf]) return IRR_FUT[inf];
  if(isReflexive(inf)) return futureStem(stripReflex(inf));
  if(inf.endsWith("re")) return inf.slice(0,-1);
  return inf;
}

function impStem(inf){
  if(inf === "être") return "ét";
  const pres = conjPresent(inf);
  const nous = pres[3];
  if(!nous || nous === "—") return null;
  return nous.replace(/ons$/,"");
}

function conjFuture(inf){
  if(isReflexive(inf)){
    const base = stripReflex(inf);
    const stem = futureStem(base);
    return [stem+"ai",stem+"as",stem+"a",stem+"ons",stem+"ez",stem+"ont"].map((f,i)=> makeReflex(REFLEX_PRON[i],f));
  }
  const stem = futureStem(inf);
  return [stem+"ai",stem+"as",stem+"a",stem+"ons",stem+"ez",stem+"ont"];
}

function conjImparfait(inf){
  if(isReflexive(inf)){
    const base = stripReflex(inf);
    return conjImparfait(base).map((f,i)=> makeReflex(REFLEX_PRON[i],f));
  }
  const stem = impStem(inf);
  if(!stem) return ["—","—","—","—","—","—"];
  return [stem+"ais",stem+"ais",stem+"ait",stem+"ions",stem+"iez",stem+"aient"];
}

function conjConditionnel(inf){
  if(isReflexive(inf)){
    const base = stripReflex(inf);
    const stem = futureStem(base);
    return [stem+"ais",stem+"ais",stem+"ait",stem+"ions",stem+"iez",stem+"aient"].map((f,i)=> makeReflex(REFLEX_PRON[i],f));
  }
  const stem = futureStem(inf);
  return [stem+"ais",stem+"ais",stem+"ait",stem+"ions",stem+"iez",stem+"aient"];
}

function conjSubjonctif(inf){
  if(SUBJ_IRREG[inf]) return SUBJ_IRREG[inf].slice();
  if(isReflexive(inf)){
    const base = stripReflex(inf);
    return conjSubjonctif(base).map((f,i)=> makeReflex(REFLEX_PRON[i],f));
  }
  const pres = conjPresent(inf);
  const ils = pres[5];
  const imp = impStem(inf);
  if(!ils || ils === "—" || !imp) return ["—","—","—","—","—","—"];
  const sgStem = ils.replace(/ent$/,"");
  return [sgStem+"e",sgStem+"es",sgStem+"e",imp+"ions",imp+"iez",sgStem+"ent"];
}

function conjPasseCompose(inf){
  const refl = isReflexive(inf);
  const pp = pastParticiple(inf);
  const aux = (refl || ETRE_VERBS.has(inf)) ? "être" : "avoir";
  const auxPres = conjPresent(aux);
  const forms = [];
  for(let i=0;i<6;i++){
    const a = auxPres[i];
    if(a === "—"){ forms.push("—"); continue; }
    const base = a + " " + pp;
    forms.push(refl ? makeReflex(REFLEX_PRON[i], base) : base);
  }
  return forms;
}

function conjPlusQueParfait(inf){
  const refl = isReflexive(inf);
  const pp = pastParticiple(inf);
  const aux = (refl || ETRE_VERBS.has(inf)) ? "être" : "avoir";
  const auxImp = conjImparfait(aux);
  const forms = [];
  for(let i=0;i<6;i++){
    const a = auxImp[i];
    if(a === "—"){ forms.push("—"); continue; }
    const base = a + " " + pp;
    forms.push(refl ? makeReflex(REFLEX_PRON[i], base) : base);
  }
  return forms;
}

function conjPasseSimple(inf){
  if(PASS_SIMPLE_IRREG[inf]) return PASS_SIMPLE_IRREG[inf].slice();
  if(isReflexive(inf)){
    const base = stripReflex(inf);
    return conjPasseSimple(base).map((f,i)=> makeReflex(REFLEX_PRON[i],f));
  }
  if(inf.endsWith("er")){
    const stem = inf.slice(0,-2);
    return [stem+"ai",stem+"as",stem+"a",stem+"âmes",stem+"âtes",stem+"èrent"];
  }
  if(inf.endsWith("ir")){
    const stem = inf.slice(0,-2);
    return [stem+"is",stem+"is",stem+"it",stem+"îmes",stem+"îtes",stem+"irent"];
  }
  if(inf.endsWith("re")){
    const stem = inf.slice(0,-2);
    return [stem+"is",stem+"is",stem+"it",stem+"îmes",stem+"îtes",stem+"irent"];
  }
  return ["?","?","?","?","?","?"];
}

function conjImperatif(inf){
  if(isReflexive(inf)){
    const base = stripReflex(inf);
    const bp = conjPresent(base);
    let tu = bp[1];
    if(base.endsWith("er")) tu = tu.replace(/s$/,"");
    return [tu+"-toi", bp[3]+"-nous", bp[4]+"-vous"];
  }
  const pres = conjPresent(inf);
  let tu = pres[1];
  if((inf.endsWith("er") && inf !== "aller") || inf === "aller") tu = tu.replace(/s$/,"");
  return [tu, pres[3], pres[4]];
}

function conjTense(inf, tense){
  switch(tense){
    case "present": return conjPresent(inf);
    case "imparfait": return conjImparfait(inf);
    case "futur": return conjFuture(inf);
    case "passeCompose": return conjPasseCompose(inf);
    case "plusQueParfait": return conjPlusQueParfait(inf);
    case "conditionnel": return conjConditionnel(inf);
    case "subjonctif": return conjSubjonctif(inf);
    case "passeSimple": return conjPasseSimple(inf);
    case "imperatif": return conjImperatif(inf);
    default: return conjPresent(inf);
  }
}

function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s'\-]/g," ").replace(/\s+/g," ").trim(); }
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }

function pickN(arr,n){
  if(arr.length<=n) return arr.slice();
  const s = shuffle(arr);

}
function acceptedAnswers(en){
  const parts = en.split(/[–—\-\/\(\)]/).map(norm).filter(Boolean);
  const out = new Set();
  parts.forEach(p=>{
    out.add(p);
    out.add(p.replace(/^to\s+/,""));
    if(p.startsWith("to ")) out.add(p.slice(3));
  });
  return Array.from(out);
}

  try{

    u.lang = "fr-FR"; u.rate = 0.9;
    const v = window.speechSynthesis.getVoices().find(x=>/^fr/i.test(x.lang));
    if(v) u.voice = v;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function pickVerb(excludeId){
  for(let i=0;i<20;i++){
    const v = VERBS[randInt(VERBS.length)];
    if(v.id !== excludeId) return v;
  }
  return VERBS[0];
}
function pickTense(){
  return TENSE_IDS[randInt(TENSE_IDS.length)];
}
function pickConjTense(){
  return ["present","imparfait","futur","passeCompose","conditionnel","subjonctif"][randInt(6)];
}
const SUBJ_SINGLE = ["Je","Tu","Il","Nous","Vous","Ils"];
const SUBJ_QUE = ["que je","que tu","qu'il","que nous","que vous","qu'ils"];

function makeSentence(v, tense, person){
  const forms = conjTense(v.fr, tense);
  let form = forms[person];
  if(!form || form === "—") return null;
  if(tense === "imperatif"){
    const imp = conjImperatif(v.fr);
    if(!imp[0]) return null;
    return (imp[0] || "").charAt(0).toUpperCase() + (imp[0] || "").slice(1) + " !";
  }
  if(tense === "subjonctif"){
    let p = SUBJ_QUE[person];
    if(/^[aeiouéèêàâîôû]/i.test(form) && (person===0 || person===2)){
      p = person===0 ? "que j'" : "qu'il ";
      return p + form + ".";
    }
    return p + " " + form + ".";
  }
  const subj = SUBJ_SINGLE[person];
  let s;
  if(subj === "Je" && /^[aeiouéèêàâîôû]/i.test(form)){
    s = "J'" + form;
  } else {
    s = subj + " " + form;
  }
  return s + ".";
}

function qMcqFrEn(){
  const v = pickVerb();
  const wrongs = pickN(VERBS.filter(x=>x.id!==v.id), 3).map(x=>x.en);
  return {
    type:"mcq", prompt:"Que signifie…",
    word: v.fr,
    options: shuffle([v.en, ...wrongs]),
    answer: v.en,
    verbId: v.id, category:"vocab"
  };
}
function qMcqEnFr(){

    options: shuffle([v.fr, ...wrongs]),

}

}
function qTypeEnFr(){
  const v = pickVerb();
  return {
    type:"type", prompt:"Traduis en français",
    word: v.en,
    answer: v.fr,
    accepted: [norm(v.fr)],
    verbId: v.id, category:"vocab-reverse"
  };
}
function qConjMcq(){
  const v = pickVerb();
  const tense = pickConjTense();
  const person = randInt(6);
  const forms = conjTense(v.fr, tense);
  const correct = forms[person];
  if(!correct || correct === "—") return qConjMcq();
  const wrongSet = new Set();
  TENSE_IDS.forEach(t=>{
    if(t === tense) return;
    const f = conjTense(v.fr, t)[person];
    if(f && f !== correct && f !== "—") wrongSet.add(f);
  });
  forms.forEach((f,i)=>{ if(i!==person && f !== correct && f !== "—") wrongSet.add(f); });
  for(let i=0;i<8 && wrongSet.size<6;i++){
    const ov = pickVerb(v.id);
    const f = conjTense(ov.fr, tense)[person];
    if(f && f !== correct && f !== "—") wrongSet.add(f);
  }
  const wrongs = shuffle(Array.from(wrongSet)).slice(0,3);
  if(wrongs.length < 3) return qConjMcq();
  const pronoun = PRONOUNS[person].split(" ")[0];
  return {
    type:"mcq", prompt:"Conjugue au " + TENSE_INFO[tense].name,
    word: v.fr,
    sub: pronoun + " …",
    options: shuffle([correct, ...wrongs]),
    answer: correct,
    verbId: v.id, tense, person, category:"conj"
  };
}
function qConjForm(){
  const v = pickVerb();
  const tense = pickConjTense();
  const person = randInt(6);
  const form = conjTense(v.fr, tense)[person];
  if(!form || form === "—") return qConjForm();
  const pronoun = PRONOUNS[person].split(" ")[0];
  return {
    type:"type", prompt:"Conjugue au " + TENSE_INFO[tense].name,
    word: v.fr,
    sub: pronoun + " …",
    answer: form,
    accepted: [norm(form)],
    verbId: v.id, tense, person, category:"conj"
  };
}
function qConjBlank(){
  for(let attempt=0;attempt<8;attempt++){
    const v = pickVerb();
    const tense = pickConjTense();
    const person = randInt(6);
    const form = conjTense(v.fr, tense)[person];
    if(!form || form === "—") continue;
    const sentence = makeSentence(v, tense, person);
    if(!sentence) continue;
    const idx = sentence.indexOf(form);
    if(idx < 0) continue;
    const blanked = sentence.slice(0, idx) + "______" + sentence.slice(idx + form.length);
    return {
      type:"type", prompt:"Complète (" + TENSE_INFO[tense].name + ")",
      word: blanked,
      sub: "(" + v.fr + ")",
      answer: form,
      accepted: [norm(form)],
      verbId: v.id, tense, person, category:"conj-blank"
    };
  }
  return qConjMcq();
}
function qIdentifyTense(){
  for(let attempt=0;attempt<6;attempt++){
    const v = pickVerb();
    const tense = pickTense();
    const person = randInt(6);
    const form = conjTense(v.fr, tense)[person];
    if(!form || form === "—") continue;
    const sentence = makeSentence(v, tense, person);
    if(!sentence) continue;
    const others = TENSE_IDS.filter(t=>t !== tense);
    const wrongs = pickN(others, 3).map(t=>TENSE_INFO[t].name);
    if(wrongs.length < 3) continue;
    const correct = TENSE_INFO[tense].name;
    return {
      type:"mcq", prompt:"Quel temps est utilisé ?",
      word: sentence,
      options: shuffle([correct, ...wrongs]),
      answer: correct,
      verbId: v.id, category:"identify"
    };
  }
  return qMcqFrEn();
}

function genQ(category){
  try{
    switch(category){
      case "mcq-fr-en": return qMcqFrEn();
      case "mcq-en-fr": return qMcqEnFr();
      case "type-fr-en": return qTypeFrEn();
      case "type-en-fr": return qTypeEnFr();
      case "conj-mcq": return qConjMcq();
      case "conj-form": return qConjForm();
      case "conj-blank": return qConjBlank();
      case "identify": return qIdentifyTense();
      default: return qMcqFrEn();
    }
  }catch(e){ return qMcqFrEn(); }
}

function generateQuestions(n, categories){
  const qs = [];
  const seen = new Set();
  let safety = 0;
  while(qs.length < n && safety < n*8){
    safety++;
    const cat = categories[randInt(categories.length)];
    const q = genQ(cat);
    if(!q) continue;
    const key = (q.verbId||"x") + "|" + (q.tense||"") + "|" + (q.person!=null?q.person:"") + "|" + cat;
    if(seen.has(key)) continue;
    seen.add(key);
    qs.push(q);
  }
  return qs;
}

let game = null;
let view = "home";
let timerHandle = null;

function startGame(mode){
  initAudio(); haptic(8);
  const cfg = GAME_MODES[mode];
  if(!cfg) return;
  const qs = generateQuestions(cfg.questions, cfg.categories);
  if(!qs.length){ toast("Impossible de générer les questions"); return; }
  game = {
    mode, config: cfg, queue: qs, total: qs.length,
    done: 0, xp: 0, correct: 0, wrong: 0,
    combo: 0, bestCombo: 0,
    lives: cfg.lives || null,
    timeEnd: cfg.timer ? Date.now() + cfg.timer*1000 : null,
    timeLeft: cfg.timer || null,
    current: null, answered: false, picked: null, typedVal: null,
    startTime: Date.now()
  };
  nextQuestion();
  view = "game";
  render();
  if(cfg.timer) startTimer();
}
function startTimer(){
  clearInterval(timerHandle);
  timerHandle = setInterval(()=>{
    if(!game || !game.timeEnd){ clearInterval(timerHandle); return; }
    game.timeLeft = Math.max(0, Math.ceil((game.timeEnd - Date.now())/1000));
    const el = $("#timer");
    if(el){
      el.textContent = "⏱ " + game.timeLeft + "s";
      el.classList.toggle("danger", game.timeLeft <= 15);
    }
    if(game.timeLeft <= 0){
      clearInterval(timerHandle);
      toast("⏰ Temps écoulé !");
      setTimeout(()=> endGame(), 600);
    }
  }, 250);
}
function nextQuestion(){
  if(!game) return;
  if(!game.queue.length){ endGame(); return; }
  game.current = game.queue.shift();
  game.answered = false;
  game.picked = null;
  game.typedVal = null;
}
function trackResult(correct){
  const c = getCard(game.current.verbId);
  c.seen++;
  if(correct){
    c.lvl = Math.min(6, c.lvl+1);
    c.ok++;
    c.due = Date.now() + INTERVALS[Math.min(c.lvl, INTERVALS.length-1)];
    game.correct++;
    game.combo++;
    if(game.combo > game.bestCombo) game.bestCombo = game.combo;
    if(game.combo > S.stats.bestCombo) S.stats.bestCombo = game.combo;
    S.stats.totalCorrect++;
    const base = game.current.category === "conj" ? 15 : 12;
    const gain = Math.round(base * comboMult(game.combo));
    game.xp += gain;
    awardXP(gain);
    sfxCorrect(); haptic(15);
    if(game.combo >= 5 && game.combo % 5 === 0){ confetti(30); sfxCombo(); }
  } else {
    c.lvl = Math.max(0, c.lvl-1);
    c.ko++;
    c.due = Date.now() + INTERVALS[Math.max(0, c.lvl-1)];
    game.wrong++;
    game.combo = 0;
    S.stats.totalWrong++;
    if(game.lives != null) game.lives--;
    sfxWrong(); haptic(50);
  }
  game.done++;
  S.stats.todayCount++;
  save();
}
function answerMcq(opt){
  if(!game || game.answered) return;
  game.answered = true;
  game.picked = opt;
  trackResult(opt === game.current.answer);
  render();
  if(game.lives != null && game.lives <= 0){
    setTimeout(()=> endGame(true), 800);
  }
}
function answerTyped(){
  if(!game || game.answered) return;
  const input = $("#ansInput");
  if(!input) return;
  const val = input.value.trim();
  if(!val) return;
  game.answered = true;
  game.typedVal = val;
  const acc = game.current.accepted || [norm(game.current.answer)];
  const good = acc.includes(norm(val));
  trackResult(good);
  render();
  if(game.lives != null && game.lives <= 0){
    setTimeout(()=> endGame(true), 800);
  }
}
function advance(){
  nextQuestion();
  render();
}
function endGame(gameOver){
  if(!game) return;
  clearInterval(timerHandle);
  const acc = (game.correct+game.wrong) ? Math.round(game.correct/(game.correct+game.wrong)*100) : 0;
  if(acc === 100 && game.done >= 5) S.stats.perfectSessions++;
  const t = todayStr();
  if(S.stats.lastDay !== t){
    const y = todayStr(new Date(Date.now() - DAY));
    S.stats.streak = (S.stats.lastDay === y) ? (S.stats.streak + 1) : 1;
    S.stats.lastDay = t;
  }
  S.stats.sessions++;
  S.stats.days[t] = (S.stats.days[t] || 0) + game.done;
  saveNow();
  checkAchievements();
  if(acc >= 70) confetti(80);
  const summary = {
    mode: game.mode, icon: game.config.icon, name: game.config.name,
    total: game.done, xp: game.xp, correct: game.correct, wrong: game.wrong,
    accuracy: acc, bestCombo: game.bestCombo, gameOver: !!gameOver,
    mins: Math.max(1, Math.round((Date.now() - game.startTime)/60000))
  };
  game = null;
  renderEndGame(summary);
}

    else if(c.due <= now) due.push(v);
  });
  const pool = [...due, ...shuffle(fresh), ...shuffle(VERBS)];

  const seenIds = new Set();

  pool.forEach(v=>{ if(!seenIds.has(v.id)){ seenIds.add(v.id); unique.push(v); } });

function bindFlashcardEvents(v){
  const el = $("#fc");
  const drag = $("#fcDrag");

  // Free drag
  let dragging = false, sx=0, sy=0, moved=false;
  el.addEventListener("pointerdown", e=>{
    if(e.target.closest("button")) return;
    dragging = true; sx = e.clientX; sy = e.clientY; moved = false;
    drag.classList.add("dragging");
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", e=>{
    if(!dragging) return;
    const dx = e.clientX - sx;
    const dy = e.clientY - sy;
    if(Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    drag.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx*0.04}deg)`;
  });
  const endDrag = ()=>{
    if(!dragging) return;
    dragging = false;
    drag.classList.remove("dragging");
    drag.style.transform = "";
    if(!moved){
      flashcards.flipped = !flashcards.flipped;
      el.classList.toggle("flipped", flashcards.flipped);
      if(flashcards.flipped) speak(v.fr);
      haptic(8);
    }
  };
  el.addEventListener("pointerup", endDrag);
  el.addEventListener("pointercancel", ()=>{ dragging=false; drag.classList.remove("dragging"); drag.style.transform=""; });

  const speakBtn = $("#fcSpeak");
  if(speakBtn) speakBtn.addEventListener("click", e=>{ e.stopPropagation(); speak(v.fr); });
  ["#fcConj","#fcConj2"].forEach(sel=>{
    const b = $(sel);
    if(b) b.addEventListener("click", e=>{ e.stopPropagation(); openConjugation(v); });
  });

  const quit = $("#fcQuit");
  if(quit) quit.addEventListener("click", ()=>{ flashcards = null; view = "home"; render(); });

  const prev = $("#fcPrev");
  if(prev) prev.addEventListener("click", ()=>{
    if(flashcards.idx > 0){
      flashcards.idx--;
      flashcards.current = flashcards.queue[flashcards.idx];
      flashcards.flipped = false;
      render();
    }
  });
  const next = $("#fcNext");
  if(next) next.addEventListener("click", ()=>{
    if(flashcards.idx < flashcards.queue.length - 1){
      flashcards.idx++;
      flashcards.current = flashcards.queue[flashcards.idx];
      flashcards.flipped = false;
      flashcards.reviewed++;
      render();
    }
  });
  const hard = $("#fcHard");
  if(hard) hard.addEventListener("click", ()=>{
    const c = getCard(v.id);
    c.ko++; c.seen++; c.lvl = Math.max(0, c.lvl-1);
    c.due = Date.now() + INTERVALS[Math.max(0,c.lvl-1)];
    save();
    sfxWrong();
    if(flashcards.idx < flashcards.queue.length - 1){
      flashcards.idx++; flashcards.current = flashcards.queue[flashcards.idx];
      flashcards.flipped = false; render();
    }
  });
  const easy = $("#fcEasy");
  if(easy) easy.addEventListener("click", ()=>{
    const c = getCard(v.id);
    c.ok++; c.seen++; c.lvl = Math.min(6, c.lvl+1);
    c.due = Date.now() + INTERVALS[Math.min(c.lvl, INTERVALS.length-1)];
    save();
    sfxCorrect();
    if(flashcards.idx < flashcards.queue.length - 1){
      flashcards.idx++; flashcards.current = flashcards.queue[flashcards.idx];
      flashcards.flipped = false; render();
    }
  });
}

function bindGameEvents(q){
  const quit = $("#quitGame");
  if(quit) quit.addEventListener("click", ()=>{

      clearInterval(timerHandle);
      game = null; view = "home"; render();
    }
  });
  $$("[data-opt]").forEach(b=>{
    b.addEventListener("click", ()=>{ initAudio(); answerMcq(b.dataset.opt); });
  });
  const cb = $("#checkBtn");
  if(cb) cb.addEventListener("click", ()=>{ initAudio(); answerTyped(); });
  const input = $("#ansInput");

  }
  const nb = $("#nextBtn");
  if(nb) nb.addEventListener("click", ()=>{
    if(game.lives != null && game.lives <= 0){ endGame(true); return; }
    advance();
  });
}

function startGameWithSize(mode, size){
  const cfg = GAME_MODES[mode];

    mode, config: { ...cfg, questions: size },

    lives: cfg.lives || null,

    timeLeft: cfg.timer || null,
    current: null, answered: false, picked: null, typedVal: null,
    startTime: Date.now()
  };
  nextQuestion();
  view = "game";
  render();
  if(cfg.timer) startTimer();
}

function paintList(){
  const q = norm(browseQuery);
  const list = VERBS.filter(v=>{
    const c = S.cards[v.id];
    const lvl = c ? c.lvl : 0;
    const seen = c ? c.seen : 0;
    if(browseFilter === "new" && seen > 0) return false;
    if(browseFilter === "weak" && !(seen > 0 && lvl <= 2)) return false;
    if(browseFilter === "strong" && !(lvl >= 3 && lvl <= 4)) return false;
    if(browseFilter === "mastered" && lvl < 5) return false;
    if(q){ if(!norm(v.fr+" "+v.en).includes(q)) return false; }
    return true;
  });
  const el = $("#vlist");
  if(!el) return;
  if(!list.length){
    el.innerHTML = '<div class="empty"><span class="em">🔍</span>Aucun verbe trouvé</div>';

  el.innerHTML = list.map(v=>{
    const c = S.cards[v.id];

      if(v) openVerbDetail(v);
    });
  });
}

/* =========================================================================
   EXPORT / IMPORT
   ========================================================================= */
function exportState(){
  try{
    const payload = {
      _meta:{ app:"fr215", version:4, exportedAt: new Date().toISOString(), verbCount: VERBS.length, totalXP: S.stats.xp, mastered: masteredCount() },
      cards: S.cards, stats: S.stats, settings: S.settings, unlocked: S.unlocked, ui: S.ui
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const stamp = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const a = document.createElement("a");
    a.href = url; a.download = "verbes-fr-215-"+stamp+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 800);
    confetti(40); toast("📤 Sauvegarde exportée !", true);
  }catch(err){ console.error(err); toast("❌ Export impossible"); }
}
function readImportFile(file){
  if(file.size > 5*1024*1024){ toast("❌ Fichier trop volumineux"); return; }
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data || typeof data !== "object") throw new Error("JSON invalide");
      if(!data.cards && !data.stats) throw new Error("Pas une sauvegarde FR215");
      const meta = data._meta || {};
      const cardCount = Object.keys(data.cards || {}).length;
      const xp = (data.stats && data.stats.xp) || 0;
      const mastered = masteredFromState(data);
      const msg = "Remplacer ta progression ?\n\n📦 Importée :\n• XP : "+xp+"\n• Verbes vus : "+cardCount+"\n• Maîtrisés : "+mastered+
        (meta.exportedAt ? "\n• Export : "+new Date(meta.exportedAt).toLocaleDateString() : "");
      if(!confirm(msg)) return;
      const d = defaultState();
      S = {
        v:4, cards: data.cards || {},
        stats: Object.assign(d.stats, data.stats || {}),
        settings: Object.assign(d.settings, data.settings || {}),
        unlocked: data.unlocked || [],
        ui: Object.assign(d.ui, data.ui || {})
      };
      saveNow(); applyTheme();
      view = "home"; render();
      confetti(80); toast("📥 Sauvegarde importée !", true); sfxLevel();
    }catch(err){ console.error(err); toast("❌ Fichier invalide ou corrompu", true); }
  };
  reader.onerror = ()=> toast("❌ Lecture impossible");
  reader.readAsText(file);
}

let conjTab = "present";
function openConjugation(v){
  // Ensure valid tab
  if(!TENSE_IDS.includes(conjTab)) conjTab = "present";
  const forms = conjTense(v.fr, conjTab);
  const isEtreAux = ETRE_VERBS.has(v.fr) || isReflexive(v.fr);
  const pp = pastParticiple(v.fr);

  const tabs = `
    <div class="conj-tabs">
      ${TENSE_IDS.map(t=>`<button class="ctab ${conjTab===t?"on":""}" data-tab="${t}">${TENSE_INFO[t].name}</button>`).join("")}
    </div>`;

  const personList = conjTab === "imperatif"
    ? ["(tu)","(nous)","(vous)"]
    : ["je / j'","tu","il / elle","nous","vous","ils / elles"];

  const rows = forms.map((f,i)=>`
    <tr>
      <td>${conjTab === "imperatif" ? personList[i] : PRONOUNS[i]}</td>
      <td>${esc(f)}</td>
    </tr>`).join("");

  const info = TENSE_INFO[conjTab];
  let auxInfo = "";
  if(conjTab === "passeCompose" || conjTab === "plusQueParfait"){
    auxInfo = `<div class="conj-aux">Auxiliaire : <b>${isEtreAux?"être":"avoir"}</b> · Participe passé : <b>${esc(pp)}</b></div>`;
  }

  openModal(`
    <button class="iconbtn modal-close" id="mClose">✕</button>
    <h2>${esc(v.fr)}</h2>
    <p class="en">${esc(v.en)} · <span style="color:var(--accent);font-weight:700">${info.icon} ${esc(info.name)}</span></p>
    <p class="sub" style="margin-bottom:14px">${esc(info.short)}</p>
    <div class="divider"></div>
    ${tabs}
    <table class="conj-table">${rows}</table>
    ${auxInfo}
    <div style="margin-top:16px;display:flex;gap:10px">
      <button class="btn soft sm" id="mSpeak">🔊 Écouter le verbe</button>
    </div>
  `);
  const mc = $("#mClose"); if(mc) mc.addEventListener("click", closeModal);
  const ms = $("#mSpeak"); if(ms) ms.addEventListener("click", ()=> speak(v.fr));
  $$(".ctab").forEach(tab=>{
    tab.addEventListener("click", ()=>{ conjTab = tab.dataset.tab; openConjugation(v); });
  });
}

  if(btn) btn.textContent = S.settings.theme === "dark" ? "☀️" : "🌙";
}

document.addEventListener("keydown", e=>{
  if(view !== "game" || !game) return;
  const ae = document.activeElement;
  const isTyping = ae && ae.tagName === "INPUT";
  if(e.key === "Escape"){
    if(confirm("Quitter la partie ?")){ clearInterval(timerHandle); game = null; view="home"; render(); }
    return;
  }
  if(game.current && game.current.type === "mcq"){
    if(game.answered && (e.key === "Enter" || e.code === "Space")){
      e.preventDefault(); advance(); return;
    }
    if(!game.answered && ["1","2","3","4"].includes(e.key)){
      e.preventDefault();
      const i = parseInt(e.key,10)-1;
      const opt = game.current.options[i];
      if(opt){ initAudio(); answerMcq(opt); }
      return;
    }
  }
  if(game.current && game.current.type === "type" && game.answered && e.key === "Enter"){
    e.preventDefault(); advance();
  }
});

document.addEventListener("keydown", e=>{
  if(e.key === "Escape" && modalBack.classList.contains("on")) closeModal();
});

/* =========================================================================
   BOOT
   ========================================================================= */
applyTheme();
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = ()=>{ window.speechSynthesis.getVoices(); };
}
document.addEventListener("touchstart", ()=>{ initAudio(); }, { once:true, passive:true });
document.addEventListener("click", ()=>{ initAudio(); }, { once:true });

// Route flashcards to a dedicated view
const _origRender = render;
render = function(){
  if(view === "flashcards"){ renderFlashcards(); syncNav(); updateHeader(); return; }
  _origRender();
};

render();
if(!S.ui.seenIntro){
  S.ui.seenIntro = true; saveNow();
  setTimeout(()=> toast("👋 Choisis un mode et commence !", true), 900);
}
</script>
</body>
</html>
