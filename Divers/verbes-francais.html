<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4d6bfe">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>215 Verbes Français — Aventure</title>
<style>
:root{
  --bg:#f6f7fb; --card:#fff; --text:#0d0d12; --muted:#6b7280;
  --line:#e6e8ee; --accent:#4d6bfe; --accent-soft:#eef1ff;
  --good:#16a34a; --good-soft:#e8f7ee;
  --bad:#e11d48; --bad-soft:#fdeaee;
  --warn:#f59e0b; --warn-soft:#fff5e5;
  --purple:#8b5cf6; --pink:#ec4899; --gold:#fbbf24;
  --radius:18px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  --shadow-lg:0 2px 4px rgba(16,24,40,.04), 0 18px 40px rgba(16,24,40,.10);
  --safe-b:env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"]{
  --bg:#0e0f14; --card:#171922; --text:#f2f3f7; --muted:#9aa1b1;
  --line:#262a36; --accent:#7b91ff; --accent-soft:#1c2140;
  --good:#34d399; --good-soft:#10261d;
  --bad:#fb7185; --bad-soft:#2a1219;
  --warn:#fbbf24; --warn-soft:#2a2110;
  --purple:#a78bfa; --pink:#f472b6; --gold:#fcd34d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh;
  padding-bottom:calc(96px + var(--safe-b));
  transition:background .25s ease,color .25s ease;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation}
input,textarea{font-family:inherit;user-select:text;-webkit-user-select:text}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* HEADER */
header{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.hbar{max-width:760px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px;letter-spacing:-.3px}
.brand .dot{
  width:30px;height:30px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--purple));
  display:grid;place-items:center;color:#fff;font-size:13px;font-weight:900;
  box-shadow:0 4px 12px rgba(77,107,254,.35);
}
.spacer{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--card);border:1px solid var(--line);
  padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;
  box-shadow:var(--shadow);transition:transform .2s;
}
.chip.bump{animation:chipBump .4s cubic-bezier(.2,.8,.2,1)}
@keyframes chipBump{50%{transform:scale(1.18)}}
.chip.xp{color:var(--accent)}
.chip.fire{color:#f97316}
.iconbtn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--card);font-size:16px;
  transition:transform .12s ease;
}
.iconbtn:active{transform:scale(.9)}

main{max-width:760px;margin:0 auto;padding:16px 16px 0}
.view{animation:fade .3s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;margin-bottom:14px;
}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.5px}
h2{font-size:15px;margin:0 0 10px;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:13.5px;margin:0;line-height:1.5}
.muted{color:var(--muted)}
.center{text-align:center}

/* HERO */
.hero{
  display:flex;align-items:center;gap:16px;
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;margin-bottom:14px;position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at top right, color-mix(in srgb,var(--accent) 12%, transparent), transparent 60%);
  pointer-events:none;
}
.ring{position:relative;width:100px;height:100px;flex:0 0 auto;z-index:1}
.ring svg{transform:rotate(-90deg)}
.ring .val{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:20px;font-weight:900;letter-spacing:-.8px;
}
.ring .val small{display:block;font-size:9px;font-weight:700;color:var(--muted);letter-spacing:0}
.hero-txt{flex:1;min-width:0;z-index:1}
.hero-txt h1{margin-bottom:4px;font-size:20px}
.statrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.stat{
  background:var(--accent-soft);color:var(--accent);
  border-radius:9px;padding:5px 9px;font-size:11.5px;font-weight:800;
}
.stat.g{background:var(--good-soft);color:var(--good)}
.stat.w{background:var(--warn-soft);color:var(--warn)}
.stat.b{background:var(--bad-soft);color:var(--bad)}

/* BUTTONS */
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;padding:16px;border-radius:15px;min-height:54px;
  background:var(--accent);color:#fff;font-weight:800;font-size:15.5px;
  box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 32%, transparent);
  transition:transform .12s ease,filter .12s;
}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow)}
.btn.soft{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn.good{background:var(--good);box-shadow:0 8px 20px color-mix(in srgb,var(--good) 30%, transparent)}
.btn.bad{background:var(--bad);box-shadow:0 8px 20px color-mix(in srgb,var(--bad) 30%, transparent)}
.btn.sm{padding:12px 16px;font-size:13.5px;border-radius:12px;min-height:auto}
.btn[disabled]{opacity:.5;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.modecard{
  display:flex;align-items:center;gap:12px;text-align:left;
  padding:14px;border-radius:15px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow);
  transition:transform .12s ease,border-color .15s;min-height:72px;
}
.modecard:active{transform:scale(.97);border-color:var(--accent)}
.modecard .em{
  width:42px;height:42px;border-radius:13px;flex:0 0 auto;
  display:grid;place-items:center;font-size:20px;background:var(--accent-soft);
}
.modecard .t{font-weight:800;font-size:14.5px;display:block}
.modecard .d{font-size:11.5px;color:var(--muted);margin-top:2px;display:block}

/* MASTERY BARS */
.mastery{display:flex;flex-direction:column;gap:9px}
.mrow{display:flex;align-items:center;gap:10px;font-size:12.5px}
.mrow .lbl{width:100px;flex:0 0 auto;color:var(--muted);font-weight:700}
.mbar{flex:1;height:9px;border-radius:999px;background:var(--line);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.mrow .n{width:36px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}

/* SESSION */
.sess-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pbar{flex:1;height:9px;border-radius:999px;background:var(--line);overflow:hidden;position:relative}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--purple));border-radius:999px;transition:width .4s cubic-bezier(.2,.8,.2,1)}

.combo-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 12px;border-radius:999px;font-weight:900;font-size:13px;
  background:linear-gradient(135deg,var(--warn),var(--pink));color:#fff;
  box-shadow:0 6px 18px rgba(245,158,11,.35);
  animation:comboPulse 1.2s ease-in-out infinite;
}
@keyframes comboPulse{50%{transform:scale(1.06)}}

.flashcard{perspective:1400px;height:290px;margin-bottom:14px;cursor:pointer;touch-action:pan-y;user-select:none}
.fc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:24px;background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;
}
.fc-back{transform:rotateY(180deg);background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--purple) 15%, var(--accent-soft)));border-color:color-mix(in srgb,var(--accent) 30%, transparent)}
.fc-label{font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.fc-word{font-size:38px;font-weight:900;letter-spacing:-1.4px;line-height:1.1;word-break:break-word}
.fc-back .fc-word{font-size:28px;color:var(--accent);font-weight:800}
.fc-example{
  margin-top:16px;font-size:13px;font-style:italic;line-height:1.5;
  color:var(--text);opacity:.85;max-width:94%;
}
.fc-example .en{display:block;font-size:11.5px;color:var(--muted);font-style:normal;margin-top:4px}
.fc-hint{margin-top:14px;font-size:11.5px;color:var(--muted)}
.speaker{
  position:absolute;top:14px;right:14px;
  width:40px;height:40px;border-radius:12px;
  background:var(--bg);border:1px solid var(--line);
  display:grid;place-items:center;font-size:17px;
  transition:transform .12s;
}
.speaker:active{transform:scale(.85)}
.confbtn{
  position:absolute;top:14px;left:14px;
  width:40px;height:40px;border-radius:12px;
  background:var(--bg);border:1px solid var(--line);
  display:grid;place-items:center;font-size:16px;
  transition:transform .12s;
}
.confbtn:active{transform:scale(.85)}

.opts{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.opt{
  padding:16px;border-radius:15px;text-align:left;font-size:15px;font-weight:700;
  background:var(--card);border:1.5px solid var(--line);box-shadow:var(--shadow);
  transition:transform .1s ease,border-color .15s,background .15s;
  display:flex;align-items:center;gap:10px;min-height:56px;
}
.opt:active{transform:scale(.98)}
.opt .key{
  width:26px;height:26px;border-radius:8px;flex:0 0 auto;
  background:var(--bg);border:1px solid var(--line);
  display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted);
}
.opt.correct{background:var(--good-soft);border-color:var(--good);color:var(--good);animation:pop .35s}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);animation:shake .4s}
@keyframes pop{40%{transform:scale(1.03)}}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.opt[disabled]{pointer-events:none;opacity:.7}
.opt.correct[disabled],.opt.wrong[disabled]{opacity:1}

.typebox{display:flex;gap:9px;margin-bottom:14px}
.typebox input{
  flex:1;padding:16px;border-radius:15px;font-size:16px;font-weight:600;
  border:1.5px solid var(--line);background:var(--card);color:var(--text);
  outline:none;transition:border-color .15s;min-height:56px;
}
.typebox input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%, transparent)}
.typebox input.ok{border-color:var(--good);background:var(--good-soft)}
.typebox input.ko{border-color:var(--bad);background:var(--bad-soft)}

.feedback{
  border-radius:14px;padding:13px 15px;margin-bottom:12px;font-size:14px;font-weight:700;
  display:flex;align-items:center;gap:10px;animation:fade .2s ease;
}
.feedback.ok{background:var(--good-soft);color:var(--good)}
.feedback.ko{background:var(--bad-soft);color:var(--bad)}

.rating{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate{
  padding:14px 6px;border-radius:14px;font-size:11px;font-weight:800;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  border:1.5px solid var(--line);background:var(--card);
  transition:transform .1s ease;min-height:74px;justify-content:center;
}
.rate:active{transform:scale(.94)}
.rate .ic{font-size:18px}
.rate.r0{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%, transparent)}
.rate.r1{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%, transparent)}
.rate.r2{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%, transparent)}
.rate.r3{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%, transparent)}

/* BROWSE */
.searchbar{
  display:flex;align-items:center;gap:9px;background:var(--card);
  border:1px solid var(--line);border-radius:15px;padding:12px 14px;
  box-shadow:var(--shadow);margin-bottom:12px;
}
.searchbar input{flex:1;border:none;background:none;outline:none;font-size:15px;color:var(--text);min-height:24px}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.fbtn{
  padding:8px 13px;border-radius:999px;font-size:12px;font-weight:800;
  background:var(--card);border:1px solid var(--line);color:var(--muted);
  transition:all .15s;min-height:34px;
}
.fbtn.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%, transparent)}

.vlist{display:flex;flex-direction:column;gap:8px}
.vitem{
  display:flex;align-items:center;gap:11px;padding:12px 13px;
  background:var(--card);border:1px solid var(--line);border-radius:15px;
  box-shadow:var(--shadow);transition:transform .1s;cursor:pointer;
}
.vitem:active{transform:scale(.99);border-color:var(--accent)}
.vitem .num{
  width:32px;height:32px;flex:0 0 auto;border-radius:10px;
  display:grid;place-items:center;font-size:11px;font-weight:800;
  background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums;
}
.vitem .fr{font-weight:800;font-size:15px;letter-spacing:-.2px;display:block}
.vitem .en{font-size:12.5px;color:var(--muted);margin-top:1px;display:block}
.vitem .body{flex:1;min-width:0}
.lvldot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}

/* STATS */
.bigstat{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px;text-align:center;box-shadow:var(--shadow);
}
.bigstat .n{font-size:26px;font-weight:900;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.bigstat .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-top:3px}
.bars{display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:6px}
.bars .b{flex:1;background:var(--accent-soft);border-radius:6px 6px 3px 3px;position:relative;min-height:4px;transition:height .5s}
.bars .b.has{background:linear-gradient(180deg,var(--accent),var(--purple))}

/* ACHIEVEMENTS */
.ach-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ach{
  aspect-ratio:1;border-radius:14px;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:6px;text-align:center;position:relative;
  border:2px solid var(--line);filter:grayscale(1);opacity:.45;
  transition:all .3s;
}
.ach.unlocked{filter:none;opacity:1;background:var(--card);border-color:var(--gold);box-shadow:0 4px 16px rgba(251,191,36,.25)}
.ach .em{font-size:24px;margin-bottom:2px}
.ach .nm{font-size:9px;font-weight:800;line-height:1.15;letter-spacing:-.2px}

/* MODAL */
.modal-back{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}
.modal-back.on{opacity:1;pointer-events:auto}
.modal{
  background:var(--card);width:100%;max-width:600px;
  border-radius:24px 24px 0 0;
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:20px 20px calc(24px + var(--safe-b));
  transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 -8px 40px rgba(0,0,0,.25);
  position:relative;
}
.modal-back.on .modal{transform:none}
.modal-handle{width:36px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 14px}
.modal h2{margin:0 0 4px;font-size:24px;letter-spacing:-.5px;padding-right:44px}
.modal .en{color:var(--muted);font-size:14px;margin-bottom:16px}
.modal-close{position:absolute;top:14px;right:14px}

/* CONJUGATION TABLE */
.conj-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.ctab{
  flex:1;padding:10px 8px;border-radius:11px;font-size:12px;font-weight:800;
  background:var(--bg);border:1px solid var(--line);color:var(--muted);
  transition:all .15s;min-height:42px;min-width:80px;
}
.ctab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.conj-table{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:14.5px}
.conj-table tr{background:var(--bg);border-radius:10px}
.conj-table td{padding:10px 12px}
.conj-table td:first-child{font-weight:800;color:var(--muted);width:34%;border-top-left-radius:10px;border-bottom-left-radius:10px;font-size:13px}
.conj-table td:last-child{font-weight:700;border-top-right-radius:10px;border-bottom-right-radius:10px}

/* BOTTOM NAV */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:color-mix(in srgb, var(--card) 90%, transparent);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);
  padding:8px 8px calc(8px + var(--safe-b));
}
.navin{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nbtn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 4px;border-radius:12px;font-size:10px;font-weight:800;
  color:var(--muted);transition:color .15s,background .15s;
}
.nbtn .ic{font-size:19px;line-height:1}
.nbtn.on{color:var(--accent);background:var(--accent-soft)}

/* FLOATING XP */
.xp-float{
  position:fixed;font-weight:900;font-size:20px;color:var(--good);
  pointer-events:none;z-index:9999;
  text-shadow:0 2px 8px rgba(22,163,74,.4);
  animation:xpFloat 1.1s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes xpFloat{
  0%{transform:translateY(0) scale(.6);opacity:0}
  20%{transform:translateY(-10px) scale(1.15);opacity:1}
  100%{transform:translateY(-80px) scale(1);opacity:0}
}

.confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:9998;overflow:hidden}
.confetti-layer i{position:absolute;top:-24px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{from{top:-24px;transform:rotate(0)}to{top:106vh;transform:rotate(720deg)}}

.toast{
  position:fixed;left:50%;bottom:calc(104px + var(--safe-b));
  transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:12px 20px;border-radius:999px;
  font-size:13px;font-weight:800;z-index:9997;opacity:0;
  transition:opacity .3s, transform .3s;
  box-shadow:var(--shadow-lg);white-space:nowrap;max-width:90vw;
  text-align:center;overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.big{
  padding:16px 24px;font-size:14.5px;
  top:50%;bottom:auto;white-space:normal;max-width:80vw;
  transform:translate(-50%, -50%) scale(.8);
  transition:opacity .3s, transform .3s;
}
.toast.big.show{transform:translate(-50%, -50%) scale(1)}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .em{font-size:44px;display:block;margin-bottom:12px}
.divider{height:1px;background:var(--line);margin:14px 0}
kbd{
  background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;
  border-radius:6px;padding:1px 6px;font-size:11px;font-weight:800;font-family:inherit;
}

.import-drop{

  "être":"été","avoir":"eu","faire":"fait","dire":"dit","redire":"redit",

  "être":"ser","avoir":"aur","aller":"ir","faire":"fer",

  "voir":"verr","prévoir":"prévoir","pouvoir":"pourr","vouloir":"voudr",

const ETRE_VERBS = new Set([
  "aller","venir","arriver","partir","entrer","sortir","monter","descendre",
  "rester","tomber","naître","mourir","devenir","revenir","rentrer","retourner",
  "se lever","se coucher","s'habiller","se changer","se reposer","s'amuser",
  "s'appeler","s'inquiéter","s'excuser","se souvenir","se plaindre","se rendre",
  "se déplacer","se trouver","se conduire","s'arrêter"
]);

const REFLEX_PRON = ["me","te","se","nous","vous","se"];
const PRONOUNS = ["je / j'","tu","il / elle","nous","vous","ils / elles"];

function makeReflex(pron, form){
  if(form === "—") return "—";
  const needsElision = /^[aeiouéèêàâîôû]/.test(form);
  if(needsElision){
    if(pron === "me") return "m'" + form;
    if(pron === "te") return "t'" + form;
    return pron + " " + form;
  }
  return pron + " " + form;
}

function isReflexive(inf){
  return /^se /.test(inf) || /^s'/.test(inf);
}
function stripReflex(inf){
  return inf.replace(/^se /,"").replace(/^s'/,"");
}

function conjPresent(inf){
  if(IRR_PRES[inf]) return IRR_PRES[inf].slice();
  if(isReflexive(inf)){
    const base = stripReflex(inf);
    const baseForms = conjPresent(base);
    return baseForms.map((f,i)=> makeReflex(REFLEX_PRON[i], f));
  }
  if(inf.endsWith("er")){
    const stem = inf.slice(0,-2);
    return [stem+"e", stem+"es", stem+"e", stem+"ons", stem+"ez", stem+"ent"];
  }
  if(inf.endsWith("ir")){
    const PARTIR_TYPE = new Set(["partir","sortir","dormir","sentir"]);
    const stem = inf.slice(0,-2);
    if(PARTIR_TYPE.has(inf)){
      return [stem+"s", stem+"s", stem+"t", stem+"ons", stem+"ez", stem+"ent"];
    }
    return [stem+"is", stem+"is", stem+"it", stem+"issons", stem+"issez", stem+"issent"];
  }
  if(inf.endsWith("re")){
    const stem = inf.slice(0,-2);
    return [stem+"s", stem+"s", stem, stem+"ons", stem+"ez", stem+"ent"];
  }
  return ["?","?","?","?","?","?"];
}

function pastParticiple(inf){
  if(IRREG_PP[inf]) return IRREG_PP[inf];
  if(isReflexive(inf)) return pastParticiple(stripReflex(inf));
  if(inf.endsWith("er")) return inf.slice(0,-2)+"é";
  if(inf.endsWith("ir")) return inf.slice(0,-2)+"i";
  if(inf.endsWith("re")) return inf.slice(0,-2)+"u";
  return "?";
}

function futureStem(inf){
  if(IRREG_FUT[inf]) return IRREG_FUT[inf];
  if(isReflexive(inf)) return futureStem(stripReflex(inf));
  if(inf.endsWith("re")) return inf.slice(0,-1);
  return inf;
}

function conjFuture(inf){
  if(isReflexive(inf)){
    const base = stripReflex(inf);
    const stem = futureStem(base);
    const forms = [stem+"ai", stem+"as", stem+"a", stem+"ons", stem+"ez", stem+"ont"];
    return forms.map((f,i)=> makeReflex(REFLEX_PRON[i], f));
  }
  const stem = futureStem(inf);
  return [stem+"ai", stem+"as", stem+"a", stem+"ons", stem+"ez", stem+"ont"];
}

function conjPasseCompose(inf){
  const refl = isReflexive(inf);
  const pp = pastParticiple(inf);
  const aux = (refl || ETRE_VERBS.has(inf)) ? "être" : "avoir";
  const auxPres = conjPresent(aux);
  const forms = [];
  for(let i=0;i<6;i++){
    const a = auxPres[i];
    if(a === "—"){ forms.push("—"); continue; }
    const baseForm = a + " " + pp;
    if(refl) forms.push(makeReflex(REFLEX_PRON[i], baseForm));
    else forms.push(baseForm);
  }
  return forms;
}

let audioCtx = null;
function initAudio(){
  if(audioCtx) return;
  try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
}
function beep(freq, dur, type, vol){
  if(!S.settings.sound || !audioCtx) return;
  try{
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || 0.08, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + (dur || 0.15));
    o.start(t); o.stop(t + (dur || 0.15));
  }catch(e){}
}

const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function norm(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
}
function shuffle(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
function acceptedAnswers(en){
  const parts = en.split(/[–—\-\/\(\)]/).map(norm).filter(Boolean);
  const out = new Set();
  parts.forEach(p=>{
    out.add(p);
    out.add(p.replace(/^to\s+/,""));
    if(p.startsWith("to ")) out.add(p.slice(3));
  });
  return Array.from(out);
}
function speak(text){
  if(!S.settings.sound) return;
  if(!("speechSynthesis" in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR"; u.rate = 0.9;
    const v = window.speechSynthesis.getVoices().find(x=>/^fr/i.test(x.lang));
    if(v) u.voice = v;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ============================================================
   SESSION
   ============================================================ */
let sess = null;

function pickVerbs(size){
  const now = Date.now();
  const due = [], fresh = [];
  VERBS.forEach(v=>{
    const c = S.cards[v.id];
    if(!c || c.seen === 0) fresh.push({ v, due:0, lvl:0 });
    else if(c.due <= now) due.push({ v, due:c.due, lvl:c.lvl });
  });
  due.sort((a,b)=> (a.lvl - b.lvl) || (a.due - b.due));
  const pool = [...due, ...shuffle(fresh)];
  return pool.slice(0, size).map(x=>x.v);
}

function startSession(size, mode){
  const picked = pickVerbs(size);
  if(!picked.length){ toast("Tout est à jour ! 🎉"); return; }
  sess = {
    mode,
    queue: picked.map(v=>v.id),
    total: picked.length,
    done: 0,
    xp: 0,
    ok: 0,
    ko: 0,
    combo: 0,
    bestCombo: 0,
    current: null,
    revealed: false,
    answered: false,
    picked: null,
    options: null,
    startTime: Date.now()
  };
  bumpDaily();
  nextCard();
  view = "session";
  render();
}

function nextCard(){
  if(!sess) return;
  if(!sess.queue.length){ endSession(); return; }
  const id = sess.queue.shift();
  sess.current = VERBS.find(v=>v.id === id);
  sess.revealed = false;
  sess.answered = false;
  sess.picked = null;
  if(sess.mode === "mcq"){
    const others = shuffle(VERBS.filter(v=>v.id !== id)).slice(0,3);
    sess.options = shuffle([sess.current, ...others]);
  } else {
    sess.options = null;
  }
}

function comboMult(c){
  if(c >= 20) return 3;
  if(c >= 10) return 2;
  if(c >= 5) return 1.5;
  return 1;
}

function trackCombo(){
  if(sess.combo > sess.bestCombo) sess.bestCombo = sess.combo;
  if(sess.combo > S.stats.bestCombo) S.stats.bestCombo = sess.combo;
}

function gradeFlash(quality){
  if(!sess || !sess.current) return;
  const v = sess.current;
  const c = getCard(v.id);
  const before = c.lvl;
  const rect = $(".flashcard");
  const x = rect ? rect.getBoundingClientRect().left + rect.getBoundingClientRect().width/2 : window.innerWidth/2;
  const y = rect ? rect.getBoundingClientRect().top + 40 : 200;

  if(quality === 0){
    c.lvl = Math.max(0, c.lvl - 2); c.ko++; sess.ko++; sess.combo = 0;
    sfxWrong(); haptic(40);
  } else if(quality === 1){
    c.lvl = Math.max(1, c.lvl); c.ko++; sess.ko++; sess.combo = 0;
    sfxWrong(); haptic(20);
  } else if(quality === 2){
    c.lvl = Math.min(6, c.lvl + 1); c.ok++; sess.ok++; sess.combo++;
    sfxCorrect(); haptic(15);
  } else {
    c.lvl = Math.min(6, c.lvl + 2); c.ok++; sess.ok++; sess.combo++;
    sfxCorrect(); haptic([10,30,10]);
  }
  c.due = Date.now() + INTERVALS[Math.min(c.lvl, INTERVALS.length-1)];
  c.seen++;
  if(quality >= 2) S.stats.totalCorrect++; else S.stats.totalWrong++;
  trackCombo();

  const mult = comboMult(sess.combo);
  const base = quality === 0 ? 2 : quality === 1 ? 5 : quality === 2 ? 10 : 13;
  const gain = Math.round(base * mult);
  awardXP(gain, x, y);
  if(sess.combo >= 3) sfxCombo(sess.combo);
  if(sess.combo > 0 && sess.combo % 5 === 0) confetti(30);

  sess.done++;
  S.stats.todayCount++;
  if(quality <= 1 && sess.total <= 12){
    sess.queue.push(v.id);
    sess.total++;
  }
  if(quality === 3 && before < 6 && c.lvl >= 6){
    confetti(40);
    toast("👑 " + v.fr + " maîtrisé !");
  }
  save();
  nextCard();
  render();
  checkAchievements();
}

function answerMCQ(v){
  if(!sess || sess.answered) return;
  sess.answered = true;
  const correct = v.id === sess.current.id;
  sess.picked = v.id;
  const c = getCard(sess.current.id);
  c.seen++;
  const rect = $(".opts");
  const x = rect ? rect.getBoundingClientRect().left + 60 : window.innerWidth/2;
  const y = rect ? rect.getBoundingClientRect().top : 300;

  if(correct){
    c.lvl = Math.min(6, c.lvl + 1); c.ok++; sess.ok++; sess.combo++;
    c.due = Date.now() + INTERVALS[Math.min(c.lvl, INTERVALS.length-1)];
    S.stats.totalCorrect++;
    trackCombo();
    awardXP(Math.round(12 * comboMult(sess.combo)), x, y);
    sfxCorrect(); haptic(15);
  } else {
    c.lvl = Math.max(0, c.lvl - 1); c.ko++; sess.ko++; sess.combo = 0;
    c.due = Date.now() + INTERVALS[Math.max(0,c.lvl-1)];
    S.stats.totalWrong++;
    awardXP(2, x, y);
    sfxWrong(); haptic(50);
  }
  sess.done++;
  S.stats.todayCount++;
  save();
  render();
  checkAchievements();
}

function answerType(){
  if(!sess || sess.answered) return;
  const input = $("#typeInput");
  if(!input) return;
  const val = input.value.trim();
  if(!val) return;
  sess.answered = true;
  const acc = acceptedAnswers(sess.current.en);
  const good = acc.includes(norm(val));
  const c = getCard(sess.current.id);
  c.seen++;
  const rect = input.getBoundingClientRect();
  const x = rect.left + rect.width/2;
  const y = rect.top;

  if(good){
    c.lvl = Math.min(6, c.lvl + 1); c.ok++; sess.ok++; sess.combo++;
    c.due = Date.now() + INTERVALS[Math.min(c.lvl, INTERVALS.length-1)];
    S.stats.totalCorrect++;
    trackCombo();
    awardXP(Math.round(15 * comboMult(sess.combo)), x, y);
    sfxCorrect(); haptic(15);
  } else {
    c.lvl = Math.max(0, c.lvl - 1); c.ko++; sess.ko++; sess.combo = 0;
    c.due = Date.now() + INTERVALS[Math.max(0,c.lvl-1)];
    S.stats.totalWrong++;
    awardXP(3, x, y);
    sfxWrong(); haptic(50);
  }
  sess.done++;
  S.stats.todayCount++;
  save();
  render();
  checkAchievements();
}

function endSession(){
  if(!sess) return;
  const t = todayStr();
  if(S.stats.lastDay !== t){
    const y = todayStr(new Date(Date.now() - DAY));
    S.stats.streak = (S.stats.lastDay === y) ? (S.stats.streak + 1) : 1;
    S.stats.lastDay = t;
  }
  S.stats.sessions++;
  S.stats.days[t] = (S.stats.days[t] || 0) + sess.total;

  const acc = (sess.ok + sess.ko) ? Math.round(sess.ok/(sess.ok+sess.ko)*100) : 0;
  if(acc === 100 && sess.total >= 5) S.stats.perfectSessions++;

  saveNow();
  checkAchievements();

  const mins = Math.max(1, Math.round((Date.now() - sess.startTime)/60000));
  const sessionBestCombo = sess.bestCombo;
  const sessionXP = sess.xp;
  const sessionMode = sess.mode;
  const sessionTotal = sess.total;

  if(acc >= 70) confetti(80);

  app.innerHTML = `
  <div class="view">
    <div class="card center" style="padding:32px 20px">
      <div style="font-size:60px;margin-bottom:8px;animation:pop 1s">${acc>=90?"🏆":acc>=70?"🎉":"💪"}</div>
      <h1 style="margin-bottom:6px">Session terminée !</h1>
      <p class="sub">${sessionTotal} carte${sessionTotal>1?"s":""} en ${mins} min</p>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:22px 0">
        <div class="bigstat"><div class="n" style="color:var(--accent)">+${sessionXP}</div><div class="l">XP</div></div>
        <div class="bigstat"><div class="n" style="color:var(--good)">${acc}%</div><div class="l">Justesse</div></div>
        <div class="bigstat"><div class="n" style="color:#f97316">${S.stats.streak}🔥</div><div class="l">Jours</div></div>
        <div class="bigstat"><div class="n" style="color:var(--purple)">${sessionBestCombo}x</div><div class="l">Meilleur combo</div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn" id="againBtn">↻ Rejouer</button>
        <button class="btn ghost" id="homeBtn">🏠 Accueil</button>
      </div>
    </div>
  </div>`;

  const againBtn = $("#againBtn");
  if(againBtn) againBtn.addEventListener("click", ()=>{
    const size = Math.min(sessionTotal, 20);
    startSession(size, sessionMode);
  });
  const homeBtn = $("#homeBtn");
  if(homeBtn) homeBtn.addEventListener("click", ()=>{ sess = null; view = "home"; render(); });

  updateHeader();
  syncNav();
}

function bindSessionEvents(){
  if(!sess) return;
  const v = sess.current;

  const quit = $("#quitBtn");
  if(quit) quit.addEventListener("click", ()=>{
    if(confirm("Quitter la session ? Progression sauvegardée.")){
      sess = null; view = "home"; render();
    }
  });

  $$("[data-speak]").forEach(b=>{
    b.addEventListener("click", e=>{
      e.stopPropagation();
      speak(b.dataset.speak);
      haptic(5);
    });
  });

  const fc = $("#fc");
  if(fc && sess.mode === "flash" && !sess.revealed){
    fc.addEventListener("click", ()=>{
      sess.revealed = true;
      speak(v.fr);
      haptic(8);
      render();
    });
  }

  const rb = $("#revealBtn");
  if(rb) rb.addEventListener("click", ()=>{
    sess.revealed = true;
    speak(v.fr);
    haptic(8);
    render();
  });

  $$("[data-rate]").forEach(b=>{
    b.addEventListener("click", ()=>{
      initAudio();
      gradeFlash(parseInt(b.dataset.rate,10));
    });
  });

  $$("[data-opt]").forEach(b=>{
    b.addEventListener("click", ()=>{
      initAudio();
      const id = parseInt(b.dataset.opt,10);
      const target = VERBS.find(x=>x.id === id);
      if(target) answerMCQ(target);
    });
  });

  const cb = $("#checkBtn");
  if(cb) cb.addEventListener("click", ()=>{ initAudio(); answerType(); });

  const ti = $("#typeInput");
  if(ti && !sess.answered){
    ti.focus();
    ti.addEventListener("keydown", e=>{
      if(e.key === "Enter"){ initAudio(); answerType(); }
    });
  }

  const nb = $("#nextBtn");
  if(nb) nb.addEventListener("click", ()=>{ nextCard(); render(); });

  $$("[data-conj]").forEach(b=>{
    b.addEventListener("click", e=>{
      e.stopPropagation();
      openConjugation(v);
    });
  });
}

let browseFilter = "all";

function renderBrowse(){
  app.innerHTML = `

      }).join("")}
    </div>
    <div class="vlist" id="vlist"></div>

  $("#searchInput").addEventListener("input", e=>{

      paintList();
    });

function paintList(){
  const q = norm(browseQuery);
  const list = VERBS.filter(v=>{
    const c = S.cards[v.id];
    const lvl = c ? c.lvl : 0;
    const seen = c ? c.seen : 0;
    if(browseFilter === "new" && seen > 0) return false;
    if(browseFilter === "weak" && !(seen > 0 && lvl <= 2)) return false;
    if(browseFilter === "strong" && !(lvl >= 3 && lvl <= 4)) return false;
    if(browseFilter === "mastered" && lvl < 5) return false;
    if(q){
      const hay = norm(v.fr + " " + v.en);
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  const el = $("#vlist");
  if(!el) return;
  if(!list.length){
    el.innerHTML = '<div class="empty"><span class="em">🔍</span>Aucun verbe trouvé</div>';
    return;
  }
  el.innerHTML = list.map(v=>{
    const c = S.cards[v.id];
    const lvl = c ? Math.min(c.lvl,6) : 0;
    const L = LEVELS[lvl];
    return `
    <div class="vitem" data-id="${v.id}">
      <span class="num">${v.id}</span>
      <span class="body">
        <span class="fr">${esc(v.fr)}</span>
        <span class="en">${esc(v.en)}</span>
      </span>
      <span class="lvldot" style="background:${L.c}"></span>
    </div>`;
  }).join("");

  $$("[data-id]", el).forEach(item=>{
    item.addEventListener("click", ()=>{
      const v = VERBS.find(x=>x.id === parseInt(item.dataset.id,10));
      if(v) openVerbDetail(v);
    });
  });
}

        <input type="file" id="importFile" accept=".json,application/json" style="display:none">
      </div>
    </div>

    <div class="card">
      <h2>⚙️ Réglages</h2>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0">
        <span style="font-weight:700;font-size:14px">Son</span>
        <button class="fbtn ${S.settings.sound?"on":""}" id="toggleSound">${S.settings.sound?"Activé":"Désactivé"}</button>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0">
        <span style="font-weight:700;font-size:14px">Vibrations</span>
        <button class="fbtn ${S.settings.haptic?"on":""}" id="toggleHaptic">${S.settings.haptic?"Activé":"Désactivé"}</button>
      </div>
      <div class="divider"></div>
      <p class="sub" style="margin-bottom:8px">Taille de session par défaut</p>
      <div class="filters" style="margin-bottom:16px">
        ${[5,10,20,50].map(n=>`<button class="fbtn ${S.settings.size===n?"on":""}" data-size="${n}">${n}</button>`).join("")}
      </div>
      <button class="btn bad sm" id="resetBtn">🗑 Réinitialiser</button>
    </div>
    <div style="height:10px"></div>
  </div>`;

  $$("[data-size]").forEach(b=>{
    b.addEventListener("click", ()=>{
      S.settings.size = parseInt(b.dataset.size,10);
      saveNow();
      renderStats();
    });
  });

  const ts = $("#toggleSound");
  if(ts) ts.addEventListener("click", ()=>{
    S.settings.sound = !S.settings.sound;
    saveNow();
    initAudio();
    if(S.settings.sound) sfxTap();
    renderStats();
  });

  const th = $("#toggleHaptic");
  if(th) th.addEventListener("click", ()=>{
    S.settings.haptic = !S.settings.haptic;
    saveNow();
    if(S.settings.haptic) haptic(20);
    renderStats();
  });

  const rb = $("#resetBtn");
  if(rb) rb.addEventListener("click", ()=>{
    if(confirm("Effacer toute ta progression ? Action définitive.")){
      S = defaultState();
      saveNow();
      view = "home";
      render();
      toast("Réinitialisé");
    }
  });

  // EXPORT
  const exb = $("#exportBtn");
  if(exb) exb.addEventListener("click", exportState);
  // IMPORT
  const imb = $("#importBtn");
  if(imb) imb.addEventListener("click", ()=> $("#importFile").click());
  const fileInput = $("#importFile");
  if(fileInput) fileInput.addEventListener("change", e=>{
    const file = e.target.files[0];
    if(file) readImportFile(file);
    e.target.value = "";
  });
  // DRAG & DROP
  const drop = $("#importDrop");
  if(drop){
    drop.addEventListener("click", ()=> $("#importFile").click());
    ["dragenter","dragover"].forEach(ev=>{
      drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.add("over"); });
    });
    ["dragleave","drop"].forEach(ev=>{
      drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.remove("over"); });
    });
    drop.addEventListener("drop", e=>{
      const file = e.dataTransfer.files[0];
      if(file) readImportFile(file);
    });
  }
}

/* ============================================================
   EXPORT / IMPORT
   ============================================================ */
function exportState(){
  try{
    const payload = {
      _meta:{
        app:"fr215",
        version: S.v || 3,
        exportedAt: new Date().toISOString(),
        verbCount: VERBS.length,
        totalXP: S.stats.xp,
        mastered: masteredCount()
      },
      cards: S.cards,
      stats: S.stats,
      settings: S.settings,
      unlocked: S.unlocked,
      ui: S.ui
    };
    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const stamp = d.getFullYear() + "-" +
      String(d.getMonth()+1).padStart(2,"0") + "-" +
      String(d.getDate()).padStart(2,"0");
    const a = document.createElement("a");
    a.href = url;
    a.download = "verbes-fr-215-" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 800);
    confetti(40);
    toast("📤 Sauvegarde exportée !", true);
  }catch(err){
    console.error(err);
    toast("❌ Export impossible");
  }
}

function readImportFile(file){
  if(file.size > 5 * 1024 * 1024){
    toast("❌ Fichier trop volumineux");
    return;
  }
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data || typeof data !== "object") throw new Error("JSON invalide");
      if(!data.cards && !data.stats) throw new Error("Pas une sauvegarde FR215");

      const meta = data._meta || {};
      const cardCount = Object.keys(data.cards || {}).length;
      const xp = (data.stats && data.stats.xp) || 0;
      const mastered = masteredCountFromState(data);

      const msg =
        "Remplacer ta progression actuelle ?\n\n" +
        "📦 Sauvegarde importée :\n" +
        "• XP : " + xp + "\n" +
        "• Verbes vus : " + cardCount + "\n" +
        "• Maîtrisés : " + mastered +
        (meta.exportedAt ? "\n• Exportée le : " + new Date(meta.exportedAt).toLocaleDateString() : "");

      if(!confirm(msg)) return;

      const d = defaultState();
      S = {
        v:3,
        cards: data.cards || {},
        stats: Object.assign(d.stats, data.stats || {}),
        settings: Object.assign(d.settings, data.settings || {}),
        unlocked: data.unlocked || [],
        ui: Object.assign(d.ui, data.ui || {})
      };
      saveNow();
      applyTheme();
      view = "home";
      render();
      confetti(80);
      toast("📥 Sauvegarde importée !", true);
      sfxLevel();
    }catch(err){
      console.error(err);
      toast("❌ Fichier invalide ou corrompu", true);
    }
  };
  reader.onerror = ()=> toast("❌ Lecture impossible");
  reader.readAsText(file);
}

/* -------- QUESTS -------- */
function renderQuests(){
  const unlockedCount = S.unlocked.length;
  const totalAch = ACHIEVEMENTS.length;
  const t = todayStr();
  const todayCount = (S.stats.todayDate === t) ? S.stats.todayCount : 0;
  const dailyGoal = 20;
  const dailyPct = Math.min(100, Math.round(todayCount/dailyGoal*100));

  app.innerHTML = `
  <div class="view">
    <h1 style="margin-bottom:6px">🎯 Défis & Trophées</h1>
    <p class="sub" style="margin-bottom:16px">${unlockedCount} / ${totalAch} débloqués</p>

    <div class="card" style="background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--purple) 15%,var(--accent-soft)));border-color:color-mix(in srgb,var(--accent) 30%, transparent)">
      <h2>🌟 Défi du jour</h2>
      <p class="sub" style="margin-bottom:12px">Réviser ${dailyGoal} cartes aujourd'hui</p>
      <div class="mbar" style="height:12px"><i style="width:${dailyPct}%;background:linear-gradient(90deg,var(--accent),var(--purple))"></i></div>
      <p style="margin:10px 0 0;font-weight:800;font-size:14px;text-align:center">${todayCount} / ${dailyGoal}</p>
    </div>

    <h2 style="margin:18px 0 12px">🏆 Trophées</h2>
    <div class="ach-grid">
      ${ACHIEVEMENTS.map(a=>{
        const un = S.unlocked.includes(a.id);
        return `
        <div class="ach ${un?"unlocked":""}" title="${esc(a.nm)}">
          <span class="em">${a.em}</span>
          <span class="nm">${esc(a.nm)}</span>
        </div>`;
      }).join("")}
    </div>
    <div style="height:10px"></div>
  </div>`;
}

/* ============================================================
   MODALS
   ============================================================ */
const modalBack = $("#modalBack");
const modal = $("#modal");

function openModal(html){
  modal.innerHTML = '<div class="modal-handle"></div>' + html;
  modalBack.classList.add("on");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  modalBack.classList.remove("on");
  document.body.style.overflow = "";
  setTimeout(()=>{ modal.innerHTML = ""; }, 350);
}
modalBack.addEventListener("click", e=>{
  if(e.target === modalBack) closeModal();
});

function openVerbDetail(v){
  const lvl = getCard(v.id).lvl;
  const L = LEVELS[Math.min(lvl,6)];
  openModal(`
    <button class="iconbtn modal-close" id="mClose">✕</button>
    <h2>${esc(v.fr)}</h2>
    <p class="en">${esc(v.en)}</p>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <span class="pill" style="background:${L.c}22;color:${L.c};padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800">${L.n}</span>
      <span class="pill" style="background:var(--bg);color:var(--muted);padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800">#${v.id}</span>
    </div>
    <div class="divider"></div>
    <p style="font-size:15px;line-height:1.5;margin:0 0 4px">${esc(v.ex)}</p>
    <p class="sub" style="font-style:italic;margin-bottom:16px">${esc(v.exEn)}</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button class="btn soft sm" id="mSpeak">🔊 Écouter</button>
      <button class="btn sm" id="mConj">📖 Conjugaison</button>
    </div>
  `);
  const mc = $("#mClose"); if(mc) mc.addEventListener("click", closeModal);
  const ms = $("#mSpeak"); if(ms) ms.addEventListener("click", ()=> speak(v.fr));
  const mj = $("#mConj"); if(mj) mj.addEventListener("click", ()=>{
    closeModal();
    setTimeout(()=> openConjugation(v), 300);
  });
}

let conjTab = "present";

function openConjugation(v){
  const pres = conjPresent(v.fr);
  const pc = conjPasseCompose(v.fr);
  const fut = conjFuture(v.fr);
  const pp = pastParticiple(v.fr);
  const isEtre = ETRE_VERBS.has(v.fr) || isReflexive(v.fr);

  const tableHTML = (forms) => `
    <table class="conj-table">
      ${forms.map((f,i)=>`<tr><td>${PRONOUNS[i]}</td><td>${esc(f)}</td></tr>`).join("")}
    </table>`;

  const tabs = `
    <div class="conj-tabs">
      <button class="ctab ${conjTab==="present"?"on":""}" data-tab="present">Présent</button>
      <button class="ctab ${conjTab==="passe"?"on":""}" data-tab="passe">Passé composé</button>
      <button class="ctab ${conjTab==="futur"?"on":""}" data-tab="futur">Futur</button>
    </div>`;

  let body = "";
  if(conjTab === "present") body = tableHTML(pres);
  else if(conjTab === "passe") body = tableHTML(pc) + `
    <p class="sub" style="margin-top:14px;font-size:12.5px">
      Auxiliaire : <b>${isEtre?"être":"avoir"}</b> · Participe passé : <b>${esc(pp)}</b>
    </p>`;
  else body = tableHTML(fut);

  openModal(`
    <button class="iconbtn modal-close" id="mClose">✕</button>
    <h2>${esc(v.fr)}</h2>
    <p class="en">${esc(v.en)}</p>
    <div class="divider"></div>
    ${tabs}
    ${body}
    <div style="margin-top:16px;display:flex;gap:10px">
      <button class="btn soft sm" id="mSpeak">🔊 ${esc(v.fr)}</button>
    </div>
  `);
  const mc = $("#mClose"); if(mc) mc.addEventListener("click", closeModal);
  const ms = $("#mSpeak"); if(ms) ms.addEventListener("click", ()=> speak(pres[0] || v.fr));
  $$(".ctab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      conjTab = tab.dataset.tab;
      openConjugation(v);
    });
  });
}

/* ============================================================
   NAV & EVENTS
   ============================================================ */
document.addEventListener("click", e=>{
  const nav = e.target.closest("[data-nav]");
  if(!nav) return;
  const target = nav.dataset.nav;
  if(target === "session"){
    if(view === "session" && sess) return;
    initAudio();
    startSession(S.settings.size || 10, "flash");
    return;
  }
  if(view === "session" && sess){
    if(!confirm("Quitter la session en cours ?")) return;
    sess = null;
  }
  view = target;
  render();
  window.scrollTo({ top:0, behavior:"smooth" });
});

$("#themeBtn").addEventListener("click", ()=>{
  S.settings.theme = S.settings.theme === "dark" ? "light" : "dark";
  applyTheme();
  saveNow();
  haptic(5);
});
function applyTheme(){
  document.documentElement.setAttribute("data-theme", S.settings.theme);
  const btn = $("#themeBtn");
  if(btn) btn.textContent = S.settings.theme === "dark" ? "☀️" : "🌙";
}

/* Keyboard shortcuts */
document.addEventListener("keydown", e=>{
  if(view !== "session" || !sess) return;
  const ae = document.activeElement;
  const isTyping = ae && ae.tagName === "INPUT";
  if(isTyping && e.key !== "Enter") return;

  if(sess.mode === "flash"){
    if(e.code === "Space" && !sess.revealed && !isTyping){
      e.preventDefault();
      sess.revealed = true;
      speak(sess.current.fr);
      render();
      return;
    }
    if(sess.revealed && ["1","2","3","4"].includes(e.key)){
      e.preventDefault();
      initAudio();
      gradeFlash(parseInt(e.key,10)-1);
      return;
    }
  }
  if(sess.mode === "mcq"){
    if(sess.answered && (e.key === "Enter" || e.code === "Space")){
      e.preventDefault();
      nextCard(); render();
      return;
    }
    if(!sess.answered && ["1","2","3","4"].includes(e.key)){
      e.preventDefault();
      const i = parseInt(e.key,10)-1;
      if(sess.options && sess.options[i]){
        initAudio();
        answerMCQ(sess.options[i]);
      }
      return;
    }
  }
  if(sess.mode === "type" && sess.answered && e.key === "Enter"){
    e.preventDefault();
    nextCard(); render();
  }
});

/* Escape closes modal */
document.addEventListener("keydown", e=>{
  if(e.key === "Escape" && modalBack.classList.contains("on")) closeModal();
});

/* ============================================================
   BOOT
   ============================================================ */
applyTheme();

if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = ()=>{ window.speechSynthesis.getVoices(); };
}

document.addEventListener("touchstart", ()=>{ initAudio(); }, { once:true, passive:true });
document.addEventListener("click", ()=>{ initAudio(); }, { once:true });

render();

if(!S.ui.seenIntro){
  S.ui.seenIntro = true;
  saveNow();
  setTimeout(()=> toast("👋 Appuie sur ⚡ Sprint éclair pour commencer !", true), 900);
}
